    def _plan(self, topic: str) -> dict[str, Any]:
        """Orchestrator: dynamically decompose the topic into subtopics."""
        logger.info("Orchestrator planning: %s", topic)
        messages: list[dict[str, Any]] = [
            {"role": "user", "content": f"Plan research for: {topic}"}
        ]
        response = self._call_llm(
            ORCHESTRATOR_SYSTEM_PROMPT,
            messages,
            max_tokens=1024,
            tools=PLANNING_TOOLS,
            tool_choice={"type": "tool", "name": "create_research_plan"},
        )

        for block in response.content:
            if block.type == "tool_use":
                return cast(dict[str, Any], block.input)

        raise ValueError("Orchestrator did not produce a research plan")

    def _research_subtopic(self, subtopic: dict[str, str]) -> dict[str, str]:
        """Worker: research a single subtopic in depth, optionally using web search."""
        title = subtopic["title"]
        logger.info("Worker researching: %s", title)

        messages: list[dict[str, Any]] = [{"role": "user", "content": subtopic["research_prompt"]}]
        response = self._call_llm(
            WORKER_SYSTEM_PROMPT, messages, use_light=True, tools=[WEB_SEARCH_TOOL]
        )
        text_parts = [block.text for block in response.content if block.type == "text"]
        return {"title": title, "content": "\n\n".join(text_parts)}

    def _synthesize(self, topic: str, research: list[dict[str, str]], instructions: str) -> str:
        """Synthesizer: combine all worker research into a coherent final article."""
        logger.info("Synthesizing %d research sections", len(research))
        sections = "\n\n---\n\n".join(f"## {r['title']}\n\n{r['content']}" for r in research)
        system = f"{SYNTHESIZER_SYSTEM_PROMPT} Synthesis instructions: {instructions}"
        user_msg = (
            f"# {topic}\n\nResearch sections:\n\n{sections}\n\n"
            "Synthesize into a complete, coherent article."
        )
        return self._call_llm_text(system, user_msg)

    def run(self, topic: str, on_event: OrchestratorCallback | None = None) -> str:
        """Execute the full orchestrator-workers pipeline."""
        self._notify = on_event or (lambda _e, _d: None)

        # Step 1: Orchestrator plans
        self._notify("plan_start", {})
        plan = self._plan(topic)
        subtopics = plan["subtopics"]
        instructions = plan["synthesis_instructions"]
        self.token_tracker.report()
        self._notify("plan_complete", {"subtopics": subtopics})

        # Step 2: Workers research in parallel
        self._notify("workers_start", {"count": len(subtopics)})
        research_results: list[dict[str, str]] = []

        with ThreadPoolExecutor(max_workers=len(subtopics)) as executor:
            futures = {
                executor.submit(self._research_subtopic, sub): sub["title"] for sub in subtopics
            }
            for future in as_completed(futures):
                title = futures[future]
                try:
                    result = future.result()
                    research_results.append(result)
                    self._notify("worker_complete", {"title": title})
                except Exception as e:
                    logger.error("Worker failed on %s: %s", title, e)

        self.token_tracker.report()

        # Step 3: Synthesize
        self._notify("synthesize_start", {})
        final = self._synthesize(topic, research_results, instructions)
        self.token_tracker.report()
        self._notify("synthesize_complete", {})

        return final


def main() -> None:
    """Run the orchestrator-workers demo."""
    console = Console()
    token_tracker = AnthropicTokenTracker()

    def on_event(event: str, data: dict[str, Any]) -> None:
        """Handle pipeline events for console display."""
        if event == "plan_start":
            console.print("\n[bold yellow]Orchestrator:[/bold yellow] Planning research...")
        elif event == "plan_complete":
            subtopics = data["subtopics"]
            console.print(
                Panel(
                    "\n".join(f"• {s['title']}" for s in subtopics),
                    title=f"Research Plan ({len(subtopics)} subtopics)",
                    border_style="cyan",
                )
            )
        elif event == "workers_start":
            console.print(
                f"\n[bold yellow]Workers:[/bold yellow] "
                f"Researching {data['count']} subtopics in parallel..."
            )
        elif event == "worker_complete":
            console.print(f"  [green]✓[/green] {data['title']}")
        elif event == "synthesize_start":
            console.print("\n[bold yellow]Synthesizer:[/bold yellow] Combining research...")
        elif event == "synthesize_complete":
            console.print("  [green]✓[/green] Done")

    header = Panel(
        "[bold cyan]Orchestrator-Workers — The Deep Dive Researcher[/bold cyan]\n\n"
        "Topic → [Orchestrator] → Dynamic subtopic list\n"
        "      → [Worker 1] + [Worker 2] + [Worker N] (parallel)\n"
        "      → [Synthesizer] → Final Article\n\n"
        "The LLM decides what to research — you define worker capabilities, not tasks.",
        title="Orchestrator-Workers",
    )

    try:
        while True:
            topic = interactive_menu(
                console,
                SUGGESTED_TOPICS,
                title="Select a Topic",
                header=header,
                allow_custom=True,
                custom_prompt="Enter your topic",
            )
            if not topic:
                break

            console.print(f"\n[bold green]Topic:[/bold green] {topic}")
            orch = OrchestratorWorkers(MODEL, LIGHT_MODEL, token_tracker)

            try:
                result = orch.run(topic, on_event=on_event)

                OUTPUT_DIR.mkdir(exist_ok=True)
                slug = topic.lower().replace(" ", "_")[:50]
                path = OUTPUT_DIR / f"{slug}.md"
                path.write_text(result, encoding="utf-8")

                console.print("\n[bold blue]Final Article:[/bold blue]")
                console.print(Markdown(result))
                abs_path = path.resolve()
                console.print(f"\n[dim]Saved to [link=file://{abs_path}]{path}[/link][/dim]")

                console.print("\n[dim]Press Enter to continue...[/dim]")
                input()
            except Exception as e:
                logger.error("Orchestration failed: %s", e)
                console.print(f"\n[red]Error: {e}[/red]")
            finally:
                token_tracker.reset()

    except KeyboardInterrupt:
        console.print("\n[yellow]Interrupted.[/yellow]")


if __name__ == "__main__":
    main()
</script>
<script type="text/plain" id="src-evaluator">"""
Evaluator-Optimizer — "The Editor's Desk"

Demonstrates one LLM generating content while another evaluates it in a loop,
refining until a quality threshold is met. Generator and Evaluator have different
prompts with different goals.

Pipeline: Research (web search) → Write (no tools) → Evaluate → Refine loop
"""

import json
from collections.abc import Callable
from pathlib import Path
from typing import Any, cast

import anthropic
from dotenv import find_dotenv, load_dotenv
from rich.console import Console
from rich.markdown import Markdown
from rich.panel import Panel
from rich.table import Table

from common import AnthropicTokenTracker, interactive_menu, setup_logging

load_dotenv(find_dotenv())
logger = setup_logging(__name__)

OUTPUT_DIR = Path("output")
MODEL = "claude-sonnet-4-6"
LIGHT_MODEL = "claude-haiku-4-5-20251001"

# Anthropic server-side web search tool — Claude decides when to search
WEB_SEARCH_TOOL = {"type": "web_search_20250305", "name": "web_search", "max_uses": 1}

SUGGESTED_TOPICS = [
    "Building Event-Driven Microservices",
    "Edge Computing for Real-Time AI",
    "Modern CSS Layout Techniques",
    "Database Sharding Strategies",
]

# --- Prompts ---

RESEARCH_SYSTEM_PROMPT = (
    "You are a technical researcher. Use web search to find current, accurate information "
    "on the topic. Write 2-3 short paragraphs synthesizing the most relevant findings. "
    "Focus on practical details, trade-offs, and real-world patterns. No preamble."
)

WRITER_SYSTEM_PROMPT = (
    "You are a technical blog writer. Given research notes, write a concise blog post. "
    "Include an introduction, 3-5 sections with informative headers, code examples where "
    "relevant, and a conclusion. Use a professional but approachable tone. "
    "Aim for under 1000 words total — no filler, no fluff."
)

REFINER_SYSTEM_PROMPT = (
    "You are a technical blog writer. Revise the draft based on the feedback provided. "
    "Address every issue and suggestion. Maintain the overall structure but improve "
    "quality. Return the complete revised post."
)

EVALUATOR_SYSTEM_PROMPT = """\
You are a demanding technical editor. Rate content 1-10 on:

1. CLARITY: Can engineers follow without re-reading? \
(9-10: crystal clear, 7-8: minor rough spots, 5-6: requires effort)
2. TECHNICAL ACCURACY: Is info correct and current? \
(9-10: production-ready, 7-8: minor imprecisions)
3. STRUCTURE: Logical flow, easy to navigate? \
(9-10: perfect progression, scannable)
4. ENGAGEMENT: Would engineers want to read this? \
(9-10: compelling, memorable)
5. HUMAN VOICE: Does it sound like a real person? \
(9-10: natural, varied rhythm, 5-6: robotic/generic)

Be specific in feedback: "The intro is generic — open with the specific problem" \
not just "make it more engaging"."""

# 5-dimension structured evaluation output
EVALUATION_TOOLS = [
    {
        "name": "evaluate_draft",
        "description": "Evaluate a blog post draft on multiple quality dimensions.",
        "input_schema": {
            "type": "object",
            "properties": {
                "clarity": {"type": "integer", "minimum": 1, "maximum": 10},
                "technical_accuracy": {"type": "integer", "minimum": 1, "maximum": 10},
                "structure": {"type": "integer", "minimum": 1, "maximum": 10},
                "engagement": {"type": "integer", "minimum": 1, "maximum": 10},
                "human_voice": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 10,
                    "description": "Does it sound like a real person?",
                },
                "issues": {
                    "type": "array",
                    "items": {"type": "string"},
                    "description": "Specific issues found",
                },
                "suggestions": {
                    "type": "array",
                    "items": {"type": "string"},
                    "description": "Actionable improvement suggestions",
                },
            },
            "required": [
                "clarity",
                "technical_accuracy",
                "structure",
                "engagement",
                "human_voice",
                "issues",
                "suggestions",
            ],
        },
    }
]

SCORE_THRESHOLD = 7.0
MAX_REFINEMENTS = 2

# Callback type: agent emits (event_name, event_data) — caller decides how to display
EvaluatorCallback = Callable[[str, dict[str, Any]], None]

SCORE_DIMENSIONS = ["Clarity", "Technical Accuracy", "Structure", "Engagement", "Human Voice"]
SCORE_KEYS = ["clarity", "technical_accuracy", "structure", "engagement", "human_voice"]


def _extract_scores(evaluation: dict[str, Any]) -> tuple[dict[str, int], float]:
    """Extract named scores from evaluation and compute average."""
    scores = dict(zip(SCORE_DIMENSIONS, (evaluation[k] for k in SCORE_KEYS)))
    return scores, sum(scores.values()) / len(scores)


class EvaluatorOptimizer:
    """Research → Write → Evaluate → Refine loop until quality threshold is met."""

    def __init__(self, model: str, light_model: str, token_tracker: AnthropicTokenTracker):
        self.client = anthropic.Anthropic()
        self.model = model
        self.light_model = light_model
        self.token_tracker = token_tracker
        self._notify: EvaluatorCallback = lambda _e, _d: None

    def _call_llm(
        self,
        system: str,
        messages: list[dict[str, Any]],
        *,
        use_light: bool = False,
        max_tokens: int = 4096,
        tools: list[dict[str, Any]] | None = None,
        tool_choice: dict[str, str] | None = None,
    ) -> anthropic.types.Message:
        """Single LLM call with token tracking."""
        model = self.light_model if use_light else self.model
        kwargs: dict[str, Any] = {}
        if tools:
            kwargs["tools"] = tools
        if tool_choice:
            kwargs["tool_choice"] = tool_choice
        tool_names = [t.get("name", t.get("type", "unknown")) for t in tools or []]
        logger.info("Calling %s, tools=%s", model, tool_names)

        response = self.client.messages.create(
            model=model,
            max_tokens=max_tokens,
            system=system,
            messages=messages,
            **kwargs,
        )
        self.token_tracker.track(response.usage)
        return response

    def _call_llm_text(self, system: str, user_message: str, **kwargs: Any) -> str:
        """Call LLM and return the text content."""
        messages: list[dict[str, Any]] = [{"role": "user", "content": user_message}]
        return cast(str, self._call_llm(system, messages, **kwargs).content[0].text)

    def _research(self, topic: str) -> str:
        """Research phase: web search gathers current data on the topic."""
        messages: list[dict[str, Any]] = [
            {"role": "user", "content": f"Research this topic: {topic}"}
        ]
        response = self._call_llm(
            RESEARCH_SYSTEM_PROMPT,
            messages,
            use_light=True,
            max_tokens=1024,
            tools=[WEB_SEARCH_TOOL],
        )
        text_parts = [block.text for block in response.content if block.type == "text"]
        return "\n\n".join(text_parts)

    def _write(self, topic: str, research: str) -> str:
        """Write phase: synthesize from research data — no tools, no web search."""
        user_msg = f"Research:\n{research}\n\nWrite a blog post about: {topic}"
        return self._call_llm_text(WRITER_SYSTEM_PROMPT, user_msg, use_light=True)

    def _refine(self, topic: str, draft: str, research: str, evaluation: dict[str, Any]) -> str:
        """Refine phase: rewrite from feedback — no tools."""
        feedback = (
            f"Issues: {json.dumps(evaluation['issues'])}\n"
            f"Suggestions: {json.dumps(evaluation['suggestions'])}"
        )
        user_msg = (
            f"Topic: {topic}\n\n"
            f"Research:\n{research}\n\n"
            f"Feedback to address:\n{feedback}\n\n"
            f"Previous draft:\n{draft}\n\n"
            "Revise the draft to address all feedback."
        )
        return self._call_llm_text(REFINER_SYSTEM_PROMPT, user_msg)

    def _evaluate(self, draft: str, topic: str) -> dict[str, Any]:
        """Evaluator: score the draft on 3 dimensions and provide feedback."""
        messages: list[dict[str, Any]] = [
            {"role": "user", "content": f"Topic: {topic}\n\nDraft to evaluate:\n\n{draft}"}
        ]
        response = self._call_llm(
            EVALUATOR_SYSTEM_PROMPT,
            messages,
            use_light=True,
            max_tokens=1024,
            tools=EVALUATION_TOOLS,
            tool_choice={"type": "tool", "name": "evaluate_draft"},
        )

        for block in response.content:
            if block.type == "tool_use":
                return cast(dict[str, Any], block.input)

        raise ValueError("Evaluator did not return structured evaluation")

    def run(self, topic: str, on_event: EvaluatorCallback | None = None) -> str:
        """Run the full pipeline: research → write → evaluate → refine loop."""
        self._notify = on_event or (lambda _e, _d: None)

        # Step 1: Research (web search gathers data)
        self._notify("research_start", {})
        research = self._research(topic)
        self.token_tracker.report()
        self._notify("research_complete", {"chars": len(research)})

        # Step 2: Write (from research data, no tools)
        self._notify("write_start", {})
        draft = self._write(topic, research)
        self._notify("draft_complete", {"chars": len(draft)})

        # Step 3: Evaluate → Refine loop
        for iteration in range(1, MAX_REFINEMENTS + 1):
            self._notify("evaluate_start", {"iteration": iteration})
            evaluation = self._evaluate(draft, topic)
            scores, avg_score = _extract_scores(evaluation)
            self.token_tracker.report()

            self._notify(
                "evaluation_complete",
                {
                    "iteration": iteration,
                    "scores": scores,
                    "avg": avg_score,
                    "issues": evaluation.get("issues", []),
                    "suggestions": evaluation.get("suggestions", []),
                },
            )

            if avg_score >= SCORE_THRESHOLD:
                self._notify("threshold_met", {"avg": avg_score})
                break

            if iteration < MAX_REFINEMENTS:
                self._notify("refining", {"avg": avg_score})
                draft = self._refine(topic, draft, research, evaluation)
                self._notify("draft_complete", {"chars": len(draft)})
            else:
                self._notify("max_iterations", {"avg": avg_score})

        return draft


def main() -> None:
    """Run the evaluator-optimizer demo."""
    console = Console()
    token_tracker = AnthropicTokenTracker()

    def on_event(event: str, data: dict[str, Any]) -> None:
        """Handle pipeline events for console display."""
        if event == "research_start":
            console.print("\n[bold yellow]Researching:[/bold yellow] Gathering current data...")
        elif event == "research_complete":
            console.print(f"  [green]✓[/green] Research: {data['chars']} chars")
        elif event == "write_start":
            console.print("\n[bold yellow]Writing:[/bold yellow] Generating initial draft...")
        elif event == "draft_complete":
            console.print(f"  [green]✓[/green] Draft: {data['chars']} chars")
        elif event == "evaluate_start":
            console.print(
                f"\n[bold yellow]Evaluating:[/bold yellow] Round {data['iteration']}"
                f"/{MAX_REFINEMENTS}..."
            )
        elif event == "evaluation_complete":
            scores = data["scores"]
            avg = data["avg"]
            table = Table(title=f"Evaluation (avg: {avg:.1f}/10)")
            table.add_column("Dimension", style="cyan")
            table.add_column("Score", justify="center")
            for dim, score in scores.items():
                color = "green" if score >= 8 else "yellow" if score >= 6 else "red"
                table.add_row(dim, f"[{color}]{score}/10[/{color}]")
            console.print(table)
            if data["issues"]:
                console.print("[bold red]Issues:[/bold red]")
                for issue in data["issues"]:
                    console.print(f"  [red]•[/red] {issue}")
            if data.get("suggestions"):
                console.print("[bold yellow]Suggestions:[/bold yellow]")
                for suggestion in data["suggestions"]:
                    console.print(f"  [yellow]•[/yellow] {suggestion}")
        elif event == "threshold_met":
            console.print(f"\n[green]Score {data['avg']:.1f} >= {SCORE_THRESHOLD} — done![/green]")
        elif event == "refining":
            console.print(
                f"[yellow]Score {data['avg']:.1f} < {SCORE_THRESHOLD} — refining...[/yellow]"
            )
        elif event == "max_iterations":
            console.print(f"\n[yellow]Max iterations reached (score: {data['avg']:.1f})[/yellow]")

    header = Panel(
        "[bold cyan]Evaluator-Optimizer — The Editor's Desk[/bold cyan]\n\n"
        "Topic → [Researcher] → data\n"
        "      → [Writer] → draft (from research, no web search)\n"
        "      → [Evaluator] → 5-dimension score + feedback\n"
        f"      → Score >= {SCORE_THRESHOLD}? → Done\n"
        "      → Below threshold → [Refiner] → Loop\n\n"
        f"Max {MAX_REFINEMENTS} refinements. "
        "Scores: clarity, accuracy, structure, engagement, human voice (1-10)",
        title="Evaluator-Optimizer",
    )

    try:
        while True:
            topic = interactive_menu(
                console,
                SUGGESTED_TOPICS,
                title="Select a Topic",
                header=header,
                allow_custom=True,
                custom_prompt="Enter your topic",
            )
            if not topic:
                break

            console.print(f"\n[bold green]Topic:[/bold green] {topic}")
            eo = EvaluatorOptimizer(MODEL, LIGHT_MODEL, token_tracker)

            try:
                result = eo.run(topic, on_event=on_event)

                OUTPUT_DIR.mkdir(exist_ok=True)
                slug = topic.lower().replace(" ", "_")[:50]
                path = OUTPUT_DIR / f"{slug}.md"
                path.write_text(result, encoding="utf-8")

                console.print("\n[bold blue]Final Article:[/bold blue]")
                console.print(Markdown(result))
                abs_path = path.resolve()
                console.print(f"\n[dim]Saved to [link=file://{abs_path}]{path}[/link][/dim]")

                console.print("\n[dim]Press Enter to continue...[/dim]")
                input()
            except Exception as e:
                logger.error("Evaluator-optimizer failed: %s", e)
                console.print(f"\n[red]Error: {e}[/red]")
            finally:
                token_tracker.reset()

    except KeyboardInterrupt:
        console.print("\n[yellow]Interrupted.[/yellow]")


if __name__ == "__main__":
    main()
</script>
<script type="text/plain" id="src-hitl">"""
Human-in-the-Loop — "The Approval Gate"

Demonstrates pausing an agentic workflow at strategic checkpoints for human review.
The LLM drafts an email, a human approves or rejects with feedback, and the LLM
revises — showing where human oversight adds the most value.
"""

from collections.abc import Callable
from typing import cast

import anthropic
from dotenv import find_dotenv, load_dotenv
from rich.console import Console
from rich.panel import Panel

from common import AnthropicTokenTracker, interactive_menu, setup_logging

load_dotenv(find_dotenv())
logger = setup_logging(__name__)

MODEL = "claude-haiku-4-5-20251001"
MAX_REVISIONS = 2

SUGGESTED_SCENARIOS = [
    "Decline a job offer politely — grateful but chose another opportunity",
    "Ask your team to work overtime this weekend — critical deadline, apologetic tone",
    "Request a meeting with a VP to discuss budget — formal, data-driven",
    "Follow up on an unanswered proposal — persistent but respectful",
]

# --- Prompts ---

SYSTEM_PROMPT = (
    "You are a professional email writer. Write clear, concise emails that match "
    "the requested tone. Output only the email — subject line, then body. "
    "No meta-commentary. Keep it under 300 words."
)

REVISE_SYSTEM_PROMPT = (
    "You are a professional email writer. Revise the email based on the feedback provided. "
    "Return only the revised email — subject line, then body. No explanation of changes."
)

# Checkpoint function type: (title, content, question) -> (approved, feedback)
CheckpointFn = Callable[[str, str, str], tuple[bool, str]]


class EmailDrafter:
    """Draft and revise emails with human checkpoints."""

    def __init__(self, model: str, token_tracker: AnthropicTokenTracker) -> None:
        self.client = anthropic.Anthropic()
        self.model = model
        self.token_tracker = token_tracker

    def _call_llm(self, system: str, user_msg: str, *, max_tokens: int = 1024) -> str:
        """Make an LLM call and return text response."""
        logger.info("Calling %s", self.model)
        response = self.client.messages.create(
            model=self.model,
            max_tokens=max_tokens,
            system=system,
            messages=[{"role": "user", "content": user_msg}],
        )
        self.token_tracker.track(response.usage)
        return cast(str, response.content[0].text)

    def _draft(self, scenario: str) -> str:
        """Generate an initial email draft from a scenario description."""
        return self._call_llm(SYSTEM_PROMPT, f"Write an email for this scenario: {scenario}")

    def _revise(self, draft: str, feedback: str) -> str:
        """Revise a draft based on human feedback."""
        user_msg = f"Original email:\n{draft}\n\nFeedback to address:\n{feedback}"
        return self._call_llm(REVISE_SYSTEM_PROMPT, user_msg)

    def run(self, scenario: str, *, checkpoint_fn: CheckpointFn | None = None) -> str:
        """Draft an email with human checkpoints for review."""
        check = checkpoint_fn or (lambda _t, _c, _q: (True, ""))

        # Step 1: Generate initial draft
        logger.info("Generating draft for: %s", scenario)
        draft = self._draft(scenario)
        self.token_tracker.report()

        # === Checkpoint 1: Draft review (high-leverage — catches wrong direction early) ===
        approved, feedback = check(
            "Draft Review",
            draft,
            "Does this email look right? Approve to finalize, or reject with feedback.",
        )

        if approved and not feedback:
            return draft
        # Edit mode: human provided replacement text
        if approved and feedback:
            return feedback

        # Rejected: enter revision loop
        for revision in range(1, MAX_REVISIONS + 1):
            logger.info("Revising draft (round %d/%d)", revision, MAX_REVISIONS)
            draft = self._revise(draft, feedback)
            self.token_tracker.report()

            # === Checkpoint 2: Revision review ===
            approved, feedback = check(
                f"Revision Review ({revision}/{MAX_REVISIONS})",
                draft,
                "Better? Approve to finalize, or reject with more feedback.",
            )

            if approved and not feedback:
                return draft
            if approved and feedback:
                return feedback

        logger.info("Max revisions reached, returning last draft")
        return draft


def human_checkpoint(console: Console, title: str, content: str, question: str) -> tuple[bool, str]:
    """Pause for human review. Returns (approved, feedback)."""
    console.print(Panel(content, title=f"Checkpoint: {title}", border_style="bright_magenta"))
    console.print(f"\n[bold magenta]{question}[/bold magenta]")
    console.print("[dim](y)es / (n)o with feedback / (e)dit to provide replacement[/dim]")
    console.print("[bold magenta]> [/bold magenta]", end="")

    response = input().strip().lower()

    if response in ("y", "yes", ""):
        return True, ""
    elif response.startswith("e"):
        console.print("[dim]Enter replacement (Enter twice to finish):[/dim]")
        lines: list[str] = []
        empty = 0
        while empty < 1:
            line = input()
            if line.strip() == "":
                empty += 1
            else:
                empty = 0
                lines.append(line)
        return True, "\n".join(lines)
    else:
        console.print("[dim]Enter feedback:[/dim] ", end="")
        feedback = input().strip()
        return False, feedback


def main() -> None:
    """Run the human-in-the-loop email drafting demo."""
    console = Console()
    token_tracker = AnthropicTokenTracker()

    def checkpoint_fn(title: str, content: str, question: str) -> tuple[bool, str]:
        return human_checkpoint(console, title, content, question)

    header = Panel(
        "[bold cyan]Human-in-the-Loop — The Approval Gate[/bold cyan]\n\n"
        "LLM drafts an email → you review at checkpoints:\n"
        "1. After draft — right tone and content?\n"
        "2. After revision — feedback addressed?\n\n"
        "Options: (y)es approve, (n)o + feedback, (e)dit replacement\n"
        f"Max {MAX_REVISIONS} revisions per email.",
        title="Human-in-the-Loop",
    )

    try:
        while True:
            scenario = interactive_menu(
                console,
                SUGGESTED_SCENARIOS,
                title="Select an Email Scenario",
                header=header,
                allow_custom=True,
                custom_prompt="Describe your email scenario",
            )
            if not scenario:
                break

            console.print(f"\n[bold green]Scenario:[/bold green] {scenario}")
            drafter = EmailDrafter(MODEL, token_tracker)

            try:
                result = drafter.run(scenario, checkpoint_fn=checkpoint_fn)

                console.print("\n[bold blue]Final Email:[/bold blue]")
                console.print(Panel(result, border_style="green"))

                console.print("\n[dim]Press Enter to continue...[/dim]")
                input()
            except Exception as e:
                logger.error("Email drafting failed: %s", e)
                console.print(f"\n[red]Error: {e}[/red]")
            finally:
                token_tracker.reset()

    except KeyboardInterrupt:
        console.print("\n[yellow]Interrupted.[/yellow]")


if __name__ == "__main__":
    main()
</script>
<script type="text/plain" id="src-contentwriter">"""
Content writer agent composing all patterns from tutorials 02-07.

Pipeline phases map to patterns:
- _classify()             → routing (03)
- _plan() / _replan()     → orchestrator (05)
- _research_parallel()    → parallel workers (05) with web search
- _write()                → prompt chaining (02) with type-specific voice
- _evaluate()             → evaluator-optimizer (06)
- _write_social()         → parallelization fan-out (04)
- _generate_seo()         → parallelization voting (04)

Human-in-the-loop (07) checkpoints are yielded as HumanCheckpointEvent and handled
by the entry point via on_human_checkpoint callback.

Async generator (run_stream) yields typed events so the UI layer can render progress
without any coupling to the agent logic.
"""

import asyncio
import json
from collections.abc import Callable
from concurrent.futures import ThreadPoolExecutor, as_completed
from typing import Any, AsyncGenerator, cast

import anthropic
from anthropic import RateLimitError
from tenacity import (
    before_sleep_log,
    retry,
    retry_if_exception_type,
    stop_after_attempt,
    wait_exponential,
)

from common import AnthropicTokenTracker, setup_logging

from . import prompts
from .models import (
    ClassificationResult,
    ClassifyDoneEvent,
    ClassifyStartEvent,
    CompleteEvent,
    ContentType,
    EvaluateDoneEvent,
    EvaluateStartEvent,
    EvaluationResult,
    HumanCheckpointEvent,
    PlanDoneEvent,
    PlanStartEvent,
    RefineStartEvent,
    ResearchDoneEvent,
    ResearchSection,
    ResearchSectionDoneEvent,
    ResearchStartEvent,
    SeoCandidateEvent,
    SeoDoneEvent,
    SeoResult,
    SeoStartEvent,
    SocialContent,
    SocialDoneEvent,
    SocialStartEvent,
    SocialWriterDoneEvent,
    Source,
    Subtopic,
    WriteDoneEvent,
    WriteStartEvent,
    WritingResult,
)
from .models import AgentEvent  # noqa: F401 — re-export for type hints
from .tools import (
    CLASSIFY_TOOLS,
    EVALUATION_TOOLS,
    PLANNING_TOOLS,
    SEO_EVALUATION_TOOLS,
    WEB_SEARCH_TOOL,
    ToolExecutor,
)

logger = setup_logging(__name__)

# Human checkpoint callback type
HumanCheckpointFn = Callable[[HumanCheckpointEvent], tuple[bool, str]]


class ContentWriterAgent:
    """Full content creation agent composing all patterns from tutorials 02-07."""

    def __init__(
        self,
        model: str,
        research_model: str,
        token_tracker: AnthropicTokenTracker,
    ) -> None:
        # Disable SDK's built-in retry — tenacity handles it with longer backoff
        self.client = anthropic.Anthropic(max_retries=0)
        self.model = model
        self.research_model = research_model
        self.token_tracker = token_tracker
        self.tool_executor = ToolExecutor()

    # ─── LLM call primitives ──────────────────────────────────────────────

    @retry(
        retry=retry_if_exception_type(RateLimitError),
        wait=wait_exponential(multiplier=2, min=30, max=120),
        stop=stop_after_attempt(6),
        before_sleep=before_sleep_log(logger, log_level=20),
    )
    def _call_api(self, **kwargs: Any) -> Any:
        """Low-level API call with retry on rate limits."""
        return self.client.messages.create(**kwargs)

    def _call_llm(
        self,
        system: str,
        messages: list[dict[str, Any]],
        *,
        use_light: bool = True,
        max_tokens: int = 4096,
        temperature: float = 1.0,
        tools: list[dict[str, Any]] | None = None,
        tool_choice: dict[str, str] | None = None,
    ) -> anthropic.types.Message:
        """Single LLM call with token tracking."""
        model = self.research_model if use_light else self.model
        kwargs: dict[str, Any] = {}
        if tools:
            kwargs["tools"] = tools
        if tool_choice:
            kwargs["tool_choice"] = tool_choice
        tool_names = [t.get("name", t.get("type", "unknown")) for t in tools or []]
        logger.info("Calling %s, tools=%s", model, tool_names)

        response = self._call_api(
            model=model,
            max_tokens=max_tokens,
            temperature=temperature,
            system=system,
            messages=messages,
            **kwargs,
        )
        self.token_tracker.track(response.usage)
        return response

    def _call_tool(self, system: str, user_message: str, tools: list, tool_name: str) -> dict:
        """LLM call that returns structured output via tool_choice."""
        response = self._call_llm(
            system,
            [{"role": "user", "content": user_message}],
            use_light=False,
            max_tokens=1024,
            tools=tools,
            tool_choice={"type": "tool", "name": tool_name},
        )
        for block in response.content:
            if block.type == "tool_use":
                return cast(dict[Any, Any], block.input)
        raise ValueError(f"No tool call in response for {tool_name}")

    def _run_agent_loop(
        self,
        system: str,
        user_message: str,
        *,
        tools: list[dict[str, Any]],
        use_light: bool = True,
        max_tokens: int = 4096,
        max_turns: int = 5,
    ) -> tuple[str, list[Source]]:
        """Agentic loop — runs LLM with tools across multiple turns."""
        messages: list[dict[str, Any]] = [{"role": "user", "content": user_message}]
        sources: list[Source] = []

        response = None
        for turn in range(max_turns):
            response = self._call_llm(
                system,
                messages,
                use_light=use_light,
                max_tokens=max_tokens,
                tools=tools,
            )

            # Collect sources from web_search_tool_result blocks
            for block in response.content:
                if block.type == "web_search_tool_result" and isinstance(block.content, list):
                    for result in block.content:
                        sources.append(Source(title=result.title, url=result.url))

            if response.stop_reason == "end_turn":
                text_parts = [b.text for b in response.content if b.type == "text"]
                return "\n\n".join(text_parts), sources

            # Tool was used — execute and feed results back
            messages.append({"role": "assistant", "content": response.content})
            tool_results = []
            for block in response.content:
                if block.type == "tool_use":
                    logger.info("  tool %s invoked (turn %d)", block.name, turn + 1)
                    result = self.tool_executor.execute(block.name, block.input)
                    tool_results.append(
                        {
                            "type": "tool_result",
                            "tool_use_id": block.id,
                            "content": result,
                        }
                    )
            if tool_results:
                messages.append({"role": "user", "content": tool_results})
            else:
                break

        if response is None:
            return "", sources
        text_parts = [b.text for b in response.content if b.type == "text"]
        return "\n\n".join(text_parts), sources

    def _call_text(
        self,
        system: str,
        user_message: str,
        *,
        use_light: bool = True,
        max_tokens: int = 4096,
        temperature: float = 1.0,
    ) -> str:
        """Single-turn LLM call without tools."""
        response = self._call_llm(
            system,
            [{"role": "user", "content": user_message}],
            use_light=use_light,
            max_tokens=max_tokens,
            temperature=temperature,
        )
        text_parts = [b.text for b in response.content if b.type == "text"]
        return "\n\n".join(text_parts)

    # ─── Pipeline phases ─────────────────────────────────────────────────

    def _classify(self, topic: str) -> ClassificationResult:
        """Classify topic into content type with structured output (routing pattern)."""
        logger.info("Phase: classify — %s", topic[:50])
        data = self._call_tool(
            prompts.CLASSIFICATION_SYSTEM, topic, CLASSIFY_TOOLS, "classify_content"
        )
        return ClassificationResult(**data)

    def _plan(
        self, topic: str, content_type: ContentType, key_aspects: list[str]
    ) -> list[Subtopic]:
        """Create a research plan with 2-4 subtopics (orchestrator pattern)."""
        logger.info("Phase: plan — %s (%s)", topic[:50], content_type.value)
        aspects_text = ", ".join(key_aspects) if key_aspects else "general overview"
        result = self._call_tool(
            f"You are a research planner for a {content_type.value} article. "
            f"Key aspects to cover: {aspects_text}. "
            "Break the topic into 2-3 focused subtopics that can be researched "
            "independently. Each should cover a distinct angle.",
            f"Plan research for: {topic}",
            PLANNING_TOOLS,
            "create_research_plan",
        )
        return [Subtopic(**s) for s in result["subtopics"]]

    def _replan(self, topic: str, plan_text: str, feedback: str) -> list[Subtopic]:
        """Revise a research plan based on human feedback."""
        logger.info("Phase: replan")
        result = self._call_tool(
            f"Revise this research plan based on feedback: {feedback}",
            f"Original plan:\n{plan_text}\n\nTopic: {topic}",
            PLANNING_TOOLS,
            "create_research_plan",
        )
        return [Subtopic(**s) for s in result["subtopics"]]

    def _research_section(self, subtopic: Subtopic) -> ResearchSection:
        """Research one subtopic using web search (worker pattern)."""
        logger.info("Phase: research — %s", subtopic.title)
        content, sources = self._run_agent_loop(
            prompts.RESEARCH_SYSTEM,
            subtopic.research_prompt,
            tools=[WEB_SEARCH_TOOL],
            max_tokens=1024,
        )
        return ResearchSection(title=subtopic.title, content=content, sources=sources)

    def _write(
        self,
        topic: str,
        sections: list[ResearchSection],
        content_type: ContentType,
        feedback: str | None = None,
        previous_draft: str | None = None,
    ) -> tuple[str, list[Source]]:
        """Write or revise the article with type-specific voice (chaining pattern)."""
        logger.info("Phase: write — %s (%s)", topic[:50], content_type.value)

        research_text = "\n\n".join(f"## {s.title}\n{s.content}" for s in sections)

        if feedback and previous_draft:
            # Revision: Sonnet with web search for additional concepts
            user_msg = (
                f"Topic: {topic}\n\n"
                f"Research:\n{research_text}\n\n"
                f"Feedback to address:\n{feedback}\n\n"
                f"Previous draft:\n{previous_draft}\n\n"
                "Revise the draft to address all feedback."
            )
            return self._run_agent_loop(
                prompts.get_revision_system(content_type),
                user_msg,
                tools=[WEB_SEARCH_TOOL],
                use_light=False,
                max_tokens=8192,
            )
        else:
            # Initial write: Sonnet for quality structure and completeness
            user_msg = (
                f"Research:\n{research_text}\n\n"
                f"Write a complete {content_type.value} about: {topic}"
            )
            content = self._call_text(
                prompts.get_writing_system(content_type),
                user_msg,
                use_light=False,
                max_tokens=8192,
            )
            return content, []

    def _evaluate(self, topic: str, draft: str) -> EvaluationResult:
        """Evaluate draft with 5-dimension structured scoring (evaluator pattern)."""
        logger.info("Phase: evaluate")
        data = self._call_tool(
            prompts.EVALUATION_SYSTEM,
            f"Topic: {topic}\n\nDraft to evaluate:\n\n{draft}",
            EVALUATION_TOOLS,
            "evaluate_draft",
        )
        return EvaluationResult(**data)

    # ─── Social media (parallelization fan-out from 04) ──────────────────

    def _write_linkedin(self, article: str) -> str:
        """Generate a LinkedIn professional summary."""
        return self._call_text(
            prompts.LINKEDIN_SYSTEM,
            f"Create a LinkedIn post from this article:\n\n{article[:2000]}",
            max_tokens=2048,
        )

    def _write_twitter(self, article: str) -> str:
        """Generate a Twitter/X thread of 5 tweets."""
        return self._call_text(
            prompts.TWITTER_SYSTEM,
            f"Create a tweet thread from this article:\n\n{article[:2000]}",
            max_tokens=2048,
        )

    def _write_newsletter(self, article: str) -> str:
        """Generate a newsletter subject line and intro paragraph."""
        return self._call_text(
            prompts.NEWSLETTER_SYSTEM,
            f"Create a newsletter intro from this article:\n\n{article[:2000]}",
            max_tokens=2048,
        )

    def _write_social(self, article: str) -> SocialContent:
        """Generate social media content in parallel (fan-out pattern)."""
        logger.info("Phase: social media fan-out")
        results: dict[str, str] = {}
        writers = {
            "linkedin": self._write_linkedin,
            "twitter": self._write_twitter,
            "newsletter": self._write_newsletter,
        }
        with ThreadPoolExecutor(max_workers=3) as executor:
            futures = {executor.submit(fn, article): name for name, fn in writers.items()}
            for future in as_completed(futures):
                name = futures[future]
                try:
                    results[name] = future.result()
                except Exception as e:
                    logger.error("Social writer %s failed: %s", name, e)
                    results[name] = f"Error: {e}"
        return SocialContent(**results)

    # ─── SEO title (parallelization voting from 04) ──────────────────────

    def _generate_seo_title(self, article: str, temperature: float) -> str:
        """Generate a single SEO title candidate at a given temperature."""
        return self._call_text(
            prompts.SEO_TITLE_SYSTEM,
            f"Generate an SEO title for:\n\n{article[:500]}",
            max_tokens=128,
            temperature=temperature,
        )

    def _vote_best_title(self, titles: list[str], article: str) -> dict:
        """Use structured output to pick the best SEO title (voting pattern)."""
        titles_text = "\n".join(f"{i + 1}. {t}" for i, t in enumerate(titles))
        return self._call_tool(
            prompts.SEO_EVALUATOR_SYSTEM,
            f"Article summary: {article[:300]}\n\nCandidate titles:\n{titles_text}",
            SEO_EVALUATION_TOOLS,
            "pick_best_title",
        )

    def _generate_seo(self, article: str) -> SeoResult:
        """Generate SEO title via voting pattern: 3 candidates → evaluator picks best."""
        logger.info("Phase: SEO title voting")
        temperatures = [0.3, 0.7, 1.0]
        titles: list[str] = []

        with ThreadPoolExecutor(max_workers=3) as executor:
            futures_list = [
                executor.submit(self._generate_seo_title, article, temp) for temp in temperatures
            ]
            for future in as_completed(futures_list):
                try:
                    titles.append(future.result().strip())
                except Exception as e:
                    logger.error("SEO title generation failed: %s", e)

        if not titles:
            return SeoResult(winning_title="", reasoning="All candidates failed", candidates=[])

        result = self._vote_best_title(titles, article)
        return SeoResult(
            winning_title=result["winning_title"],
            reasoning=result["reasoning"],
            candidates=titles,
        )

    # ─── Async event stream ──────────────────────────────────────────────

    async def run_stream(
        self,
        topic: str,
        *,
        score_threshold: float = 7.0,
        max_refinements: int = 2,
        on_human_checkpoint: HumanCheckpointFn | None = None,
    ) -> AsyncGenerator[AgentEvent, None]:
        """Async generator yielding typed events as the pipeline progresses."""
        logger.info("Pipeline start — topic=%s, threshold=%.1f", topic[:50], score_threshold)

        def _checkpoint(
            checkpoint_id: str, title: str, content: str, question: str
        ) -> tuple[bool, str]:
            """Call the human checkpoint callback if provided."""
            if on_human_checkpoint is None:
                return True, ""
            event = HumanCheckpointEvent(
                checkpoint_id=checkpoint_id,
                title=title,
                content=content,
                question=question,
            )
            return on_human_checkpoint(event)

        # === Phase 1: Classification (routing pattern from 03) ===
        yield ClassifyStartEvent()
        classification = await asyncio.to_thread(self._classify, topic)
        yield ClassifyDoneEvent(classification=classification)

        content_type = classification.content_type
        other_types = [t for t in ContentType if t != content_type]
        approved, feedback = await asyncio.to_thread(
            _checkpoint,
            "classification",
            "Classification",
            f"Type: {content_type.value.upper()}\n"
            f"Topic: {classification.topic}\n"
            f"Aspects: {', '.join(classification.key_aspects)}\n"
            f"Reasoning: {classification.reasoning}\n\n"
            f"Other options: {', '.join(t.value for t in other_types)}",
            f"Classified as '{content_type.value}'. Correct?",
        )
        if not approved and feedback in [t.value for t in ContentType]:
            content_type = ContentType(feedback)
            logger.info("Classification overridden to: %s", content_type.value)

        # === Phase 2: Research planning (orchestrator pattern from 05) ===
        yield PlanStartEvent()
        subtopics = await asyncio.to_thread(
            self._plan, topic, content_type, classification.key_aspects
        )
        yield PlanDoneEvent(subtopics=subtopics)

        # === Phase 3: Parallel research (worker pattern from 05) ===
        yield ResearchStartEvent(count=len(subtopics))

        def _research_parallel() -> list[ResearchSection]:
            results: list[ResearchSection] = []
            with ThreadPoolExecutor(max_workers=len(subtopics)) as executor:
                futures = {
                    executor.submit(self._research_section, sub): sub.title for sub in subtopics
                }
                for future in as_completed(futures):
                    title = futures[future]
                    try:
                        results.append(future.result())
                    except Exception as e:
                        logger.error("Research failed for %s: %s", title, e)
            return results

        sections = await asyncio.to_thread(_research_parallel)
        for section in sections:
            yield ResearchSectionDoneEvent(title=section.title, sources=section.sources)

        if not sections:
            raise ValueError("All research workers failed — cannot continue")
        yield ResearchDoneEvent(sections=sections)

        # Accumulate all sources across phases for the References section
        all_sources: list[Source] = []
        for s in sections:
            all_sources.extend(s.sources)

        # === Phase 4: Write (chaining pattern from 02) ===
        yield WriteStartEvent(iteration=1)
        draft, write_sources = await asyncio.to_thread(self._write, topic, sections, content_type)
        all_sources.extend(write_sources)
        yield WriteDoneEvent(
            iteration=1, content_length=len(draft), content=draft, sources=write_sources
        )

        # === Phase 5: Evaluate + refine loop (evaluator-optimizer from 06) ===
        yield EvaluateStartEvent(iteration=1)
        evaluation = await asyncio.to_thread(self._evaluate, topic, draft)
        yield EvaluateDoneEvent(iteration=1, evaluation=evaluation)

        iteration = 1
        if evaluation.avg_score < score_threshold:
            for iteration in range(2, max_refinements + 2):
                yield RefineStartEvent(iteration=iteration)
                feedback_text = (
                    f"Issues: {json.dumps(evaluation.issues)}\n"
                    f"Suggestions: {json.dumps(evaluation.suggestions)}"
                )
                draft, refine_sources = await asyncio.to_thread(
                    self._write,
                    topic,
                    sections,
                    content_type,
                    feedback=feedback_text,
                    previous_draft=draft,
                )
                all_sources.extend(refine_sources)
                yield WriteDoneEvent(
                    iteration=iteration,
                    content_length=len(draft),
                    content=draft,
                    sources=refine_sources,
                )

                yield EvaluateStartEvent(iteration=iteration)
                evaluation = await asyncio.to_thread(self._evaluate, topic, draft)
                yield EvaluateDoneEvent(iteration=iteration, evaluation=evaluation)

                if evaluation.avg_score >= score_threshold:
                    break

        # === Human checkpoint: final article review (with refinement loop) ===
        # When user rejects, combine evaluation issues + user feedback and refine
        # like the evaluator-optimizer pattern from 06
        human_approved = False
        human_review_rounds = 0
        max_human_reviews = 3

        while not human_approved and human_review_rounds < max_human_reviews:
            human_review_rounds += 1
            preview = draft[:500] + "..." if len(draft) > 500 else draft
            approved, user_feedback = await asyncio.to_thread(
                _checkpoint,
                "final_review",
                "Final Review",
                preview,
                "Approve article and publish?",
            )

            if approved:
                human_approved = True
                break

            # Combine evaluation issues with user feedback for targeted refinement
            feedback_parts = []
            if evaluation.issues:
                feedback_parts.append("Evaluation issues: " + "; ".join(evaluation.issues))
            if evaluation.suggestions:
                feedback_parts.append(
                    "Evaluation suggestions: " + "; ".join(evaluation.suggestions)
                )
            if user_feedback:
                feedback_parts.append(f"User feedback: {user_feedback}")

            if not feedback_parts:
                feedback_parts.append("Please improve the overall quality of the article.")

            combined_feedback = "\n".join(feedback_parts)
            logger.info("Human review round %d — refining with feedback", human_review_rounds)

            iteration += 1
            yield RefineStartEvent(iteration=iteration)
            draft, refine_sources = await asyncio.to_thread(
                self._write,
                topic,
                sections,
                content_type,
                feedback=combined_feedback,
                previous_draft=draft,
            )
            all_sources.extend(refine_sources)
            yield WriteDoneEvent(
                iteration=iteration,
                content_length=len(draft),
                content=draft,
                sources=refine_sources,
            )

            yield EvaluateStartEvent(iteration=iteration)
            evaluation = await asyncio.to_thread(self._evaluate, topic, draft)
            yield EvaluateDoneEvent(iteration=iteration, evaluation=evaluation)

        # Append References section to the final article
        # Deduplicate sources by URL, preserving order
        seen_urls: set[str] = set()
        unique_sources: list[Source] = []
        for src in all_sources:
            if src.url not in seen_urls:
                seen_urls.add(src.url)
                unique_sources.append(src)

        if unique_sources:
            refs = "\n\n---\n\n## References\n\n"
            refs += "\n".join(f"- [{s.title}]({s.url})" for s in unique_sources)
            draft += refs

        social: SocialContent | None = None
        seo: SeoResult | None = None

        if human_approved:
            # === Phase 6: Social media blast (parallelization fan-out from 04) ===
            yield SocialStartEvent()
            social = await asyncio.to_thread(self._write_social, draft)
            for name in ["linkedin", "twitter", "newsletter"]:
                content = getattr(social, name, "")
                if content and not content.startswith("Error:"):
                    yield SocialWriterDoneEvent(name=name)
            yield SocialDoneEvent(social=social)

            # === Phase 7: SEO title voting (parallelization voting from 04) ===
            yield SeoStartEvent()
            seo = await asyncio.to_thread(self._generate_seo, draft)
            for title in seo.candidates:
                yield SeoCandidateEvent(title=title)
            yield SeoDoneEvent(seo=seo)

        # === Complete ===
        title_line = next((ln.strip("# ") for ln in draft.split("\n") if ln.strip()), topic)
        yield CompleteEvent(
            result=WritingResult(
                content_type=content_type,
                title=title_line,
                content=draft,
                final_score=evaluation.avg_score,
                iterations=iteration,
                sources=unique_sources,
                social=social,
                seo=seo,
            )
        )
</script>
<script type="text/plain" id="src-react">"""
ReAct — "Razonar y actuar"
Bucle Reasoning + Acting: el agente alterna un paso de razonamiento (Thought)
con una llamada a herramienta (Action) y su resultado (Observation),
hasta poder dar una respuesta final.

Implementación de referencia (ilustrativa, no es código del repo original).
"""


def call_llm(messages, tools=None):
    """Una llamada al modelo. Devuelve texto + posible llamada a tool."""
    # En producción: client.messages.create(model=..., messages=..., tools=tools)
    raise NotImplementedError


def parse(reply):
    """Separa el Thought, la Action y la Final Answer de la respuesta."""
    thought = reply.split("Thought:")[-1].split("Action:")[0].strip()
    action = reply.split("Action:")[-1].split("Observation:")[0].strip()
    answer = reply.split("Final Answer:")[-1].strip() if "Final Answer:" in reply else None
    return thought, action, answer


def react(question, tools, max_steps=6):
    """Ejecuta el bucle ReAct: Thought -> Action -> Observation -> ... -> Answer."""
    trace = []                                   # historial (debug + contexto)
    context = f"Question: {question}"

    for step in range(max_steps):
        # 1) RAZONAR: el modelo produce un Thought y decide Action o Answer
        reply = call_llm([{"role": "user", "content": context}], tools=tools)
        thought, action, answer = parse(reply)
        trace.append(("thought", thought))

        # 2) TERMINAR si ya hay respuesta final
        if answer:
            return answer, trace

        # 3) ACTUAR: ejecutar la herramienta elegida
        name, arg = action.split("[", 1)[0], action.split("[", 1)[1].rstrip("]")
        observation = tools[name](arg)
        trace.append(("action", action))
        trace.append(("observation", observation))

        # 4) OBSERVAR: devolver el resultado al contexto para el siguiente paso
        context += f"\nThought: {thought}\nAction: {action}\nObservation: {observation}"

    return None, trace                            # se agotaron los pasos sin respuesta
</script>
<script type="text/plain" id="src-mapreduce">"""
Map-Reduce — procesar documentos largos
Divide el input en chunks, procesa cada chunk con un LLM en paralelo (map)
y agrega los resultados (reduce) con código determinista o un LLM final.

Implementación de referencia (ilustrativa).
"""

from concurrent.futures import ThreadPoolExecutor


def call_llm(messages, system):
    """Una llamada al modelo con salida restringida."""
    raise NotImplementedError


def chunk_text(text, max_chars=4000):
    """SPLIT: divide el texto en trozos que caben en la ventana de contexto."""
    return [text[i:i + max_chars] for i in range(0, len(text), max_chars)]


def map_chunk(chunk, system):
    """MAP: procesa UN chunk con una llamada LLM de salida restringida."""
    return call_llm([{"role": "user", "content": chunk}], system=system)


def reduce_results(partials):
    """REDUCE: agrega los resultados parciales (código determinista o un LLM)."""
    return "\n\n".join(p.get("summary", "") for p in partials)


def map_reduce(document, map_prompt):
    # 1) SPLIT: dividir el documento en chunks independientes
    chunks = chunk_text(document)

    # 2) MAP: procesar cada chunk en paralelo (sin dependencias entre sí)
    with ThreadPoolExecutor(max_workers=len(chunks)) as pool:
        partials = list(pool.map(lambda c: map_chunk(c, map_prompt), chunks))

    # 3) REDUCE: agregar todos los resultados en una salida única
    return reduce_results(partials)
</script>
<script type="text/plain" id="src-planthenexecute">"""
Plan-Then-Execute — planificar antes de ejecutar
El LLM fija el plan completo ANTES de ejecutar, y luego ejecuta los pasos
sin re-planificar (o con re-plan mínimo). Los outputs de las herramientas
solo cambian parámetros, no la secuencia.

Implementación de referencia (ilustrativa).
"""


def call_llm(messages, tool=None):
    """Una llamada al modelo con salida estructurada (tool_choice)."""
    raise NotImplementedError


def build_plan(goal):
    """PLAN: el planificador produce la secuencia completa de pasos."""
    reply = call_llm([{"role": "user", "content": f"Plan for: {goal}"}], tool="plan")
    return reply["steps"]          # -> [ {tool, args}, {tool, args}, ... ]


def execute_plan(plan, tools):
    """EXECUTE: ejecuta los pasos del plan en orden, sin re-planificar."""
    results = []
    for step in plan:
        output = tools[step["tool"]](step["args"])
        results.append(output)
    return results


def verify(goal, results):
    """VERIFY: comprueba el resultado final contra el objetivo."""
    reply = call_llm([{"role": "user",
                       "content": f"Goal: {goal}\nResults: {results}\nAchieved?"}])
    return reply.lower().startswith("yes")


def plan_then_execute(goal, tools):
    # 1) PLAN: fijar la secuencia completa de acciones
    plan = build_plan(goal)

    # 2) EXECUTE: ejecutar cada paso en orden
    results = execute_plan(plan, tools)

    # 3) VERIFY: si falla, replanificar una sola vez
    if not verify(goal, results):
        plan = build_plan(f"{goal} (retry after: {results})")
        results = execute_plan(plan, tools)

    return results
</script>
<script type="text/plain" id="src-talkerreasoner">"""
Talker-Reasoner (Dual-Speed Realtime) — "responder ya, pensar en segundo plano"
Un Talker rápido responde al instante; un Reasoner lento planifica y llama
herramientas en background; comparten un belief state como único acoplamiento.

Implementación de referencia (ilustrativa).
"""


belief = {}                      # estado compartido entre Talker y Reasoner


def call_llm(messages, model="fast"):
    """Una llamada al modelo. `fast` (Talker) vs `slow` (Reasoner)."""
    raise NotImplementedError


def talker(user_msg):
    """TALKER: responde de inmediato con lo que se sabe hasta ahora."""
    return call_llm([
        {"role": "user", "content": user_msg},
        {"role": "system", "content": f"Belief: {belief}"},
    ], model="fast")


def reasoner(user_msg):
    """REASONER: descompone, llama herramientas y escribe el belief state."""
    plan = call_llm([{"role": "user", "content": user_msg}], model="slow")
    for step in plan["steps"]:
        belief[step["key"]] = execute(step)       # escribe hallazgos


def execute(step):
    """Ejecuta una herramienta y devuelve su resultado."""
    raise NotImplementedError


def run(user_msg):
    # 1) TALKER: responder al instante (baja latencia)
    answer = talker(user_msg)

    # 2) REASONER: trabajar en segundo plano (no bloquea la respuesta)
    reasoner(user_msg)            # en producción: thread/worker separado

    # 3) TALKER: refinar la respuesta con el belief ya actualizado
    return talker(user_msg)
</script>
<script type="text/plain" id="src-reflexion">"""
Reflection — autocrítica verbal con memoria episódica
El agente actúa, se autoevalúa con crítica VERBAL, guarda la reflexión
en memoria episódica, y reintenta con esa reflexión como contexto.

Implementación de referencia (ilustrativa).
"""


memory = []                      # buffer de reflexiones (memoria episódica)


def call_llm(messages):
    """Una llamada al modelo."""
    raise NotImplementedError


def act(task):
    """ACT: genera un intento condicionado por las reflexiones previas."""
    return call_llm([{"role": "user",
                      "content": f"Task: {task}\nPrior reflections: {memory}"}])


def self_reflect(task, attempt):
    """EVALUATE: crítica VERBAL (no un score) — qué falló y cómo mejorar."""
    return call_llm([{"role": "user",
                      "content": f"Task: {task}\nAttempt: {attempt}\n"
                                 "What went wrong and how to fix it?"}])


def reflexion(task, max_trials=3):
    for trial in range(max_trials):
        # 1) ACT: generar un intento
        attempt = act(task)

        # 2) EVALUATE: autocrítica verbal del intento
        critique = self_reflect(task, attempt)
        if "no issues" in critique.lower():
            return attempt

        # 3) MEMORIZE: guardar la reflexión en memoria episódica
        memory.append(critique)

    # 4) RETRY: reintentar con las reflexiones acumuladas (loop)
    return act(task)
</script>

/* ---------- SVG ---------- */
/* ---------- geometría del mapa (grid + rutas + etiquetas) ---------- */
// Cada nodo se ubica en una celda (col,row) de una grilla uniforme, así el
// espacio entre tarjetas es siempre suficiente para las etiquetas de las flechas.
const GRID = { colW: 250, rowH: 160, nodeH: 80 };

function nodeGeom(p){
  const g = Object.assign({}, GRID, p.grid || {});
  const map = {};
  p.nodes.forEach(n => {
    const w = n.w || NODE_DEFAULT.w, h = n.h || g.nodeH;
    const cx = n.col * g.colW + g.colW / 2;
    const cy = n.row * g.rowH + h / 2;
    map[n.id] = { x: cx - w/2, y: cy - h/2, w, h, cx, cy };
  });
  return map;
}

// punto donde el segmento p→q sale del rectángulo r (p está dentro de r)
function exitRect(p, q, r){
  const dx = q[0]-p[0], dy = q[1]-p[1];
  let t = Infinity;
  if (dx > 0) t = Math.min(t, (r.x + r.w - p[0]) / dx);
  if (dx < 0) t = Math.min(t, (r.x - p[0]) / dx);
  if (dy > 0) t = Math.min(t, (r.y + r.h - p[1]) / dy);
  if (dy < 0) t = Math.min(t, (r.y - p[1]) / dy);
  if (!isFinite(t)) t = 0;
  return [p[0] + dx*t, p[1] + dy*t];
}

// Devuelve la polilínea (lista de puntos) de una flecha, que empieza y termina
// exactamente en el borde de las tarjetas.
function edgePoints(e, G){
  const s = G[e.from], t = G[e.to];
  if (!s || !t) return [];
  const o = e.off || {};
  const ox1 = o.x1||0, oy1 = o.y1||0, ox2 = o.x2||0, oy2 = o.y2||0;
  const lane = e.lane || 48;
  switch (e.route){
    case "over": {               // bucle por encima de la fila
      const y = Math.min(s.y, t.y) - lane;
      return [[s.cx+ox1, s.y], [s.cx+ox1, y], [t.cx+ox2, y], [t.cx+ox2, t.y]];
    }
    case "under": {              // bucle por debajo de la fila
      const y = Math.max(s.y+s.h, t.y+t.h) + lane;
      return [[s.cx+ox1, s.y+s.h], [s.cx+ox1, y], [t.cx+ox2, y], [t.cx+ox2, t.y+t.h]];
    }
    case "hv": {                 // horizontal desde el lateral, luego vertical
      const sx = t.cx < s.cx ? s.x : s.x + s.w;
      const ty = s.cy > t.cy ? t.y + t.h : t.y;
      return [[sx, s.cy+oy1], [t.cx+ox2, s.cy+oy1], [t.cx+ox2, ty]];
    }
    default: {                   // recta entre centros, recortada a los bordes
      const a = [s.cx+ox1, s.cy+oy1], b = [t.cx+ox2, t.cy+oy2];
      return [exitRect(a, b, s), exitRect(b, a, t)];
    }
  }
}

const ptsToD = pts => pts.map((q,i) => `${i ? "L" : "M"} ${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(" ");

// Posición de la etiqueta: sobre el segmento más largo de la flecha (zona libre).
function labelAnchor(pts, frac){
  let best = 0, bestLen = -1;
  for (let i=0;i<pts.length-1;i++){
    const L = Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]);
    if (L > bestLen){ bestLen = L; best = i; }
  }
  const a = pts[best], b = pts[best+1];
  return [a[0] + (b[0]-a[0])*frac, a[1] + (b[1]-a[1])*frac];
}

function buildSvg(p){
  const G = nodeGeom(p);
  const edges = p.edges.map(e => ({ e, pts: edgePoints(e, G) })).filter(x => x.pts.length);

  // viewBox = nodos + flechas + margen (nada queda recortado)
  let minx=Infinity, miny=Infinity, maxx=-Infinity, maxy=-Infinity;
  const grow = (x,y) => { minx=Math.min(minx,x); miny=Math.min(miny,y); maxx=Math.max(maxx,x); maxy=Math.max(maxy,y); };
  Object.values(G).forEach(r => { grow(r.x, r.y); grow(r.x+r.w, r.y+r.h); });
  edges.forEach(x => x.pts.forEach(q => grow(q[0], q[1])));
  const PAD = 34;
  minx-=PAD; miny-=PAD; maxx+=PAD; maxy+=PAD;
  const W = maxx-minx, H = maxy-miny;

  const edgePaths = edges.map(({e, pts}) =>
    `<path class="edge" data-edge="${e.id}" d="${ptsToD(pts)}" ${e.dash ? 'stroke-dasharray="6 5"' : ''}/>`).join("");

  // la placa se dimensiona luego con el ancho real del texto (fitLabels)
  const labels = edges.map(({e, pts}) => {
    if (!e.label) return "";
    const [lx, ly] = labelAnchor(pts, e.labelPos || 0.5);
    return `<g class="lbl" data-cx="${lx}" data-cy="${ly}">
      <rect class="lblplate" x="${lx-20}" y="${ly-10}" width="40" height="20" rx="10"/>
      <text class="edge-label" x="${lx}" y="${ly+3.6}" text-anchor="middle">${esc(e.label)}</text>
    </g>`;
  }).join("");

  const nodes = p.nodes.map(n => {
    const r = G[n.id];
    const model = n.model ? `<div class="nm">${esc(n.model)}</div>` : "";
    return `<foreignObject data-node="${n.id}" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}">
      <div xmlns="http://www.w3.org/1999/xhtml" class="node t-${n.type}" data-node="${n.id}">
        <div class="nh"><span>${esc(n.label)}</span></div>
        <div class="ns">${esc(n.sub)}</div>${model}
      </div></foreignObject>`;
  }).join("");

  // los mapas angostos se ven a tamaño natural; los anchos se ajustan al contenedor
  // pero nunca por debajo de 1000px (si no, la letra queda ilegible → scroll horizontal)
  const minW = Math.min(W, 1000);
  return `<svg viewBox="${minx} ${miny} ${W} ${H}" preserveAspectRatio="xMidYMid meet"
      style="width:100%;max-width:${W}px;min-width:${minW}px;height:auto;margin:0 auto">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker>
      <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" class="ahead-a"/></marker>
    </defs>
    <g id="edges">${edgePaths}</g>
    <g id="flowdots"></g>
    <g id="nodes">${nodes}</g>
    <g id="nodelabels">${labels}</g>
  </svg>`;
}

// Ajusta cada placa al ancho real del texto renderizado.
function fitLabels(){
  document.querySelectorAll("#nodelabels .lbl").forEach(g => {
    const t = g.querySelector("text"), r = g.querySelector("rect");
    const cx = +g.dataset.cx, cy = +g.dataset.cy;
    let w = 0;
    try { w = t.getComputedTextLength(); } catch(_) {}
    if (!w) w = t.textContent.length * 6.2;
    const pw = w + 18, ph = 20;
    r.setAttribute("x", cx - pw/2); r.setAttribute("y", cy - ph/2);
    r.setAttribute("width", pw); r.setAttribute("height", ph); r.setAttribute("rx", ph/2);
  });
}

/* ---------- steps / detail ---------- */
function buildDots(p){
  const dots = $("#dots");
  dots.innerHTML = p.steps.map((s,i)=>`<div class="dot" data-i="${i}" title="${esc(s.title)}"></div>`).join("");
  dots.querySelectorAll(".dot").forEach(d=>{
    d.onclick = () => { stepIdx = +d.dataset.i; renderStep(p); };
  });
}

function renderStep(p){
  const st = p.steps[stepIdx];
  const total = p.steps.length;

  // highlight nodes
  document.querySelectorAll("#nodes .node").forEach(el=>{
    const id = el.dataset.node;
    el.classList.toggle("is-active", st.active.includes(id));
  });
  // edges
  document.querySelectorAll(".edge").forEach(el=>{
    el.classList.toggle("active", st.flow.includes(el.dataset.edge));
  });
  // flow dots
  setFlowEdges(p, st.flow);

  // progress
  $("#pfill").style.width = ((stepIdx+1)/total*100) + "%";
  $("#stepinfo").textContent = `Paso ${stepIdx+1} de ${total}`;

  // dots
  document.querySelectorAll(".dot").forEach((d,i)=>{
    d.classList.toggle("on", i===stepIdx);
    d.classList.toggle("done", i<stepIdx);
  });

  // step card
  const badges = [];
  if (st.model && st.model !== "—") badges.push(`<span class="badge model">modelo: ${esc(st.model)}</span>`);
  if (st.tools && st.tools.length) st.tools.forEach(t=>badges.push(`<span class="badge tool">tool: ${esc(t)}</span>`));
  if (st.event) badges.push(`<span class="badge event">evento: ${esc(st.event)}</span>`);

  $("#stepcard").innerHTML = `
    <div class="phase">[${String(p.num).padStart(2, "0")}] ${esc(p.title)} · ${esc(st.title)}</div>
    <div class="component">Componente: ${esc(st.component)}</div>
    <div class="action">${esc(st.action)}</div>
    ${badges.length?`<div class="badges">${badges.join("")}</div>`:""}
    <div class="bc">
      <div class="box before"><h4>&lt;&lt; antes de la acción</h4><ul>${st.before.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="box after"><h4>&gt;&gt; después de la acción</h4><ul>${st.after.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    </div>
    <div class="hint">» Las líneas <b>resaltadas en verde</b> del panel <b>$ cat</b> (a la derecha) son exactamente el código de esta acción.</div>`;

  updateCodeHighlight(p);
}

function codeHl(s){
  // minimal highlight for python-ish
  return s
    .replace(/^(\s*)(#[^\n]*)$/gm, '$1<span class="cm">$2</span>')
    .replace(/\b(self|return|if|elif|else|for|while|with|def|class|import|from|break|continue|async|await|yield|and|not|in|is)\b/g, '<span class="kw">$1</span>')
    .replace(/(&quot;[^&]*?&quot;|"[^"]*")/g, '<span class="str">$1</span>')
    .replace(/(\bself\.[A-Za-z_]+)\b/g, '<span class="fn">$1</span>');
}

/* ---------- full source code viewer ---------- */
function pyLine(line){
  const tok = [];
  const mk = html => { tok.push(html); return String.fromCharCode(0xE000 + tok.length - 1); };
  let s = line;
  // strings (incl. f-strings) — single line
  s = s.replace(/([rbfu]*"(?:[^"\\\n]|\\.)*"|[rbfu]*'(?:[^'\\\n]|\\.)*')/g, m => mk(`<span class="py-str">${esc(m)}</span>`));
  // comments
  if (/^\s*#/.test(s)) s = mk(`<span class="py-cm">${esc(s)}</span>`);
  else s = s.replace(/(#[^\uE000-\uE0FF]*)$/g, m => mk(`<span class="py-cm">${esc(m)}</span>`));
  s = esc(s);
  s = s.replace(/\b(def|class|return|if|elif|else|for|while|with|import|from|as|async|await|yield|try|except|finally|raise|and|or|not|in|is|None|True|False|lambda|pass|break|continue)\b/g,'<span class="py-kw">$1</span>');
  s = s.replace(/(@[\w.]+)/g,'<span class="py-dc">$1</span>');
  s = s.replace(/\b(self\.\w+)\b/g,'<span class="py-fn">$1</span>');
  s = s.replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="py-num">$1</span>');
  tok.forEach((html,i)=> s = s.split(String.fromCharCode(0xE000 + i)).join(html));
  return s;
}

function renderCode(p){
  const srcEl = document.getElementById(p.srcId || "src-" + p.id);
  const codeview = $("#codeview");
  const title = $("#codetitle");
  if (!codeview) return;
  const raw = srcEl ? srcEl.textContent.replace(/\n$/, "") : "# código fuente no disponible";
  const lines = raw.split("\n");
  title.innerHTML = `$ cat <b>${esc(p.codeFile || p.id + ".py")}</b> · ${lines.length} líneas`;
  codeview.innerHTML = lines.map((ln,i)=>`<div class="cline" data-line="${i+1}"><span class="ln">${i+1}</span><span class="lc">${pyLine(ln) || " "}</span></div>`).join("");
}

function updateCodeHighlight(p){
  const codeview = $("#codeview");
  if (!codeview) return;
  const st = p.steps[stepIdx];
  const ranges = st.hl || [];
  const on = new Set();
  ranges.forEach(r => { for (let L=r[0]; L<=r[1]; L++) on.add(L); });
  let first = null;
  codeview.querySelectorAll(".cline").forEach(el=>{
    const ln = +el.dataset.line;
    const hl = on.has(ln);
    el.classList.toggle("hl", hl);
    if (hl && first === null) first = el;
  });
  if (first){ codeview.scrollTop = Math.max(0, first.offsetTop - 40); }
}

const MODELS_NOTE = `
  Todos los pasos corren en el <b>mismo proceso Python</b> — <b>no son sub-agentes</b>.
  La "agencia" es el código de orquestación (los métodos <code>run()</code> / <code>run_stream()</code>),
  que llama a la API de Anthropic pasando un parámetro <code>model</code> distinto en cada llamada.
  Elegir uno u otro es una optimización de <b>coste / latencia / calidad</b> (el patrón <i>dual-model strategy</i>):`;

function modelCard(p){
  const map = {};
  p.nodes.forEach(n=>{ if (n.model){ (map[n.model] = map[n.model]||[]).push(n.label); } });
  const rows = Object.entries(map).map(([m,labels])=>`<li><b>${esc(m)}</b> → ${labels.map(l=>esc(l)).join(", ")}</li>`).join("");
  return `<h3>¿Por qué se usan modelos distintos?</h3>
    <div class="modelnote">${MODELS_NOTE}
      <ul class="concepts" style="margin-top:8px">
        <li><b>Sonnet 4.6</b> (grande): pasos que exigen <b>juicio, precisión o calidad de escritura</b> — clasificar, planear, sintetizar, editar, evaluar.</li>
        <li><b>Haiku 4.5</b> (pequeño, rápido y barato): pasos <b>mecánicos o de alto volumen</b> — expandir un outline, investigar en paralelo, generar variantes de título.</li>
      </ul>
      Resultado: el modelo más capaz se usa <b>solo donde importa</b>; el resto del pipeline es más barato y rápido.
    </div>
    <h3>En este patrón</h3>
    <ul class="concepts">${rows}</ul>`;
}

/* ---------- flow dots ---------- */
let activeFlow = [];
function setFlowEdges(p, edgeIds){
  activeFlow = edgeIds.map(id => {
    const path = document.querySelector(`.edge[data-edge="${id}"]`);
    return path ? { path, len: path.getTotalLength(), t: Math.random() } : null;
  }).filter(Boolean);
}

function animateFlow(ts){
  const dots = $("#flowdots");
  if (dots){
    dots.innerHTML = "";
    activeFlow.forEach((f, idx)=>{
      const pt = f.path.getPointAtLength(f.t * f.len);
      const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx", pt.x); c.setAttribute("cy", pt.y);
      c.setAttribute("r", 4); c.setAttribute("class","flowdot");
      c.style.opacity = Math.sin(Math.PI * f.t) < 0.1 ? 0.2 : 1;
      dots.appendChild(c);
    });
  }
  // advance t
  activeFlow.forEach(f => { f.t = (f.t + 0.006) % 1; });
  requestAnimationFrame(animateFlow);
}
requestAnimationFrame(animateFlow);

/* ---------- tooltips ---------- */
function attachNodeTips(p){
  document.querySelectorAll("#nodes .node").forEach(el=>{
    const id = el.dataset.node;
    const n = p.nodes.find(x=>x.id===id);
    if (!n) return;
    el.addEventListener("mouseenter", e=>{
      tip.innerHTML = `<b>${esc(n.label)}</b> <span class="ttmodel">· ${esc(TYPE_LABEL[n.type]||"")}${n.model?(" · "+esc(n.model)):""}</span><br>${esc(n.sub)}`;
      tip.style.opacity = 1;
    });
    el.addEventListener("mousemove", e=>{
      tip.style.left = (e.clientX + 14) + "px";
      tip.style.top = (e.clientY + 14) + "px";
    });
    el.addEventListener("mouseleave", ()=>{ tip.style.opacity = 0; });
    // click → jump to the first step where this node is active
    el.addEventListener("click", ()=>{
      tip.style.opacity = 0;
      const idx = p.steps.findIndex(s => s.active.includes(id));
      if (idx >= 0){ stepIdx = idx; renderStep(p); }
    });
  });
}

/* ---------- controls ---------- */
function attachControls(p){
  $("#btnStart").onclick = ()=>{ stepIdx = 0; renderStep(p); };
  $("#btnPrev").onclick = ()=>{ if (stepIdx>0){stepIdx--; renderStep(p);} };
  $("#btnNext").onclick = ()=>{ if (stepIdx<p.steps.length-1){stepIdx++; renderStep(p);} };
  $("#btnEnd").onclick = ()=>{ stepIdx = p.steps.length-1; renderStep(p); };
  $("#btnPlay").onclick = ()=> togglePlay(p);
  $("#progress").onclick = e=>{
    const r = e.currentTarget.getBoundingClientRect();
    const ratio = (e.clientX - r.left) / r.width;
    stepIdx = Math.max(0, Math.min(p.steps.length-1, Math.floor(ratio * p.steps.length)));
    renderStep(p);
  };
}

// single global keyboard handler (avoids duplicate listeners)
document.addEventListener("keydown", e => {
  if (current === null) return;
  const p = PATTERNS.find(x => x.id === current);
  if (!p) return;
  if (e.key === "ArrowRight"){ stepIdx = Math.min(p.steps.length-1, stepIdx+1); renderStep(p); }
  else if (e.key === "ArrowLeft"){ stepIdx = Math.max(0, stepIdx-1); renderStep(p); }
  else if (e.key === " "){ e.preventDefault(); togglePlay(p); }
});

function togglePlay(p){
  if (playing) stopPlay();
  else {
    playing = true;
    $("#btnPlay").textContent = "⏸ Pausar";
    timer = setInterval(()=>{
      if (stepIdx < p.steps.length-1){ stepIdx++; renderStep(p); }
      else stopPlay();
    }, speed);
  }
}
function stopPlay(){
  playing = false;
  if (timer){ clearInterval(timer); timer = null; }
  const b = $("#btnPlay"); if (b) b.textContent = "▶ Reproducir";
}

   BIBLIOTECA DE PATRONES + TÉCNICAS

const CX_ES = { "low": "baja", "medium": "media", "high": "alta", "very high": "muy alta" };
