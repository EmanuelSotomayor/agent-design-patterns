<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrones de diseño agénticos</title>
<script src="library_data.js"></script>
<style>
  :root{
    --bg:#0b1020; --panel:#111831; --panel2:#161e3a; --line:#233056; --line2:#2c3a63;
    --text:#e6ecff; --muted:#93a0c4; --dim:#5d6b92;
    --blue:#4d8dff; --teal:#2dd4bf; --purple:#b57bff; --pink:#ff5ca8; --green:#3ecf6e;
    --amber:#f5a623; --slate:#8b98b8; --red:#ff6b6b;
    --accent:#7aa2ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{background:
    radial-gradient(1200px 600px at 15% -10%, #16224a 0%, transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, #1a1440 0%, transparent 55%),
    var(--bg);}

  .topbar{display:flex;align-items:center;gap:14px;padding:16px 22px 10px;flex-wrap:wrap;}
  .topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px;}

  .tabs{display:flex;gap:8px;padding:8px 22px 12px;flex-wrap:wrap;}
  .tab{cursor:pointer;padding:8px 13px;border-radius:10px;font-size:13px;font-weight:600;
    background:var(--panel);border:1px solid var(--line);color:var(--muted);transition:.15s;white-space:nowrap;}
  .tab:hover{border-color:var(--line2);color:var(--text)}
  .tab.active{background:linear-gradient(135deg,#233a7a,#2a1d57);color:#fff;border-color:#3c55a8;}
  .tab .n{display:inline-block;min-width:18px;text-align:center;background:#00000033;border-radius:6px;
    margin-right:6px;font-size:11px;padding:1px 5px;}

  .layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:0 22px 30px;align-items:start;}
  .layout>*,.libwrap .mapcard,#detbody{min-width:0;}  /* el mapa hace scroll dentro de su marco en pantallas angostas */

  .mapcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .mapcard .head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .mapcard .head h2{margin:0;font-size:16px;}
  .mapcard .head .tag{font-size:11px;color:var(--muted);}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;font-size:10.5px;color:var(--muted);}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;}

  .mapwrap{position:relative;width:100%;overflow-x:auto;}
  .mapwrap svg{display:block;height:auto;}
  .edge{stroke:#3a4a7c;stroke-width:2;fill:none;marker-end:url(#ah);}
  .edge.active{stroke:var(--accent);stroke-width:2.6;marker-end:url(#ahA);}
  .ahead{fill:#3a4a7c;} .ahead-a{fill:var(--accent);}
  .edge-label{font-size:10.5px;font-weight:600;fill:var(--text);}
  .lblplate{fill:#0d1430;stroke:#33406e;stroke-width:1;}
  .flowdot{fill:#fff;filter:drop-shadow(0 0 6px var(--accent));}

  .node{width:100%;height:100%;border-radius:12px;border:1.5px solid var(--line2);background:var(--panel2);
    display:flex;flex-direction:column;justify-content:center;padding:8px 11px;cursor:pointer;transition:.15s;
    box-shadow:0 4px 14px #00000055;overflow:hidden;}
  .node:hover{border-color:#4a5f9e;transform:translateY(-1px);}
  .node .nh{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;line-height:1.15;}
  .node .nh .ic{font-size:14px;}
  .node .ns{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.2;}
  .node .nm{font-size:9px;margin-top:5px;color:var(--dim);letter-spacing:.3px;text-transform:uppercase;}
  .node.is-active{border-color:var(--accent);box-shadow:0 0 0 3px #7aa2ff33, 0 0 24px #4d8dff55;}
  .node.is-active .nh{color:#fff;}

  /* type colors */
  .t-input{border-left:4px solid var(--slate);}
  .t-sonnet{border-left:4px solid var(--blue);}
  .t-haiku{border-left:4px solid var(--teal);}
  .t-tool{border-left:4px solid var(--purple);}
  .t-human{border-left:4px solid var(--pink);}
  .t-output{border-left:4px solid var(--green);}
  .t-decision{border-left:4px solid var(--amber);}
  .t-group{border-left:4px solid var(--slate);border-style:dashed;}

  .controls{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .btn{cursor:pointer;border:1px solid var(--line2);background:var(--panel2);color:var(--text);
    border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;transition:.15s;}
  .btn:hover{border-color:#4a5f9e;}
  .btn.primary{background:linear-gradient(135deg,#2f4fbe,#3b2a8c);border-color:#4460c0;}
  .btn:disabled{opacity:.4;cursor:default;}
  .progress{flex:1;min-width:120px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;cursor:pointer;}
  .progress .fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));width:0%;transition:width .2s;}
  .stepinfo{font-size:12px;color:var(--muted);}

  .dots{display:flex;gap:5px;flex-wrap:wrap;}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--line2);cursor:pointer;transition:.15s;}
  .dot.on{background:var(--accent);transform:scale(1.25);}
  .dot.done{background:var(--line);}

  .below{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start;}
  @media(max-width:940px){.below{grid-template-columns:minmax(0,1fr)}}
  .below2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;align-items:start;}
  @media(max-width:820px){.below2{grid-template-columns:minmax(0,1fr)}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .card h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}
  .card .phase{font-size:11px;color:var(--amber);font-weight:700;letter-spacing:.5px;margin-bottom:6px;}
  .card .action{font-size:14.5px;line-height:1.45;margin-bottom:12px;}
  .card .component{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:10px;}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .badge{font-size:10.5px;padding:3px 8px;border-radius:7px;background:#00000033;border:1px solid var(--line2);color:var(--muted);}
  .badge.model{color:#cfe0ff;border-color:#3c55a8;}
  .badge.tool{color:#e5d0ff;border-color:#6d4bb0;}
  .badge.event{color:#cff3e8;border-color:#2c7a5c;}

  .bc{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  @media(max-width:560px){.bc{grid-template-columns:1fr}}
  .box{border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.4;}
  .box.before{background:#2a1414;border:1px solid #5a2a2a;}
  .box.after{background:#12281c;border:1px solid #275437;}
  .box h4{margin:0 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;}
  .box.before h4{color:var(--red);}
  .box.after h4{color:var(--green);}
  .box ul{margin:0;padding-left:15px;}
  .box li{margin:3px 0;}

  .code{background:#0a0f1e;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.5;
    color:#c9d6ff;white-space:pre-wrap;word-break:break-word;overflow:auto;}
  .code .kw{color:var(--purple);} .code .fn{color:var(--blue);} .code .str{color:#7ee0a8;} .code .cm{color:var(--dim);}

  /* --- code viewer (full source) --- */
  .codecard{display:flex;flex-direction:column;min-height:0;}
  .codetitle{font-size:11.5px;color:var(--muted);font-family:ui-monospace,monospace;padding:0 0 9px;
    border-bottom:1px solid var(--line);margin-bottom:9px;}
  .codetitle b{color:var(--accent);}
  .codeview{background:#080c1a;border:1px solid var(--line);border-radius:10px;overflow:auto;
    max-height:600px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
    line-height:1.55;position:relative;scroll-behavior:smooth;}
  .cline{display:flex;white-space:pre;min-width:max-content;position:relative;}
  .cline .ln{flex:0 0 auto;width:44px;text-align:right;padding-right:12px;color:var(--dim);
    user-select:none;border-right:1px solid var(--line);margin-right:12px;}
  .cline .lc{color:#c9d6ff;padding-right:16px;}
  .cline.hl{background:#1c2c58;}
  .cline.hl .ln{color:var(--accent);font-weight:700;}
  .cline.hl .lc{color:#ffffff;}
  .cline.hl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);}
  .py-kw{color:var(--purple);} .py-str{color:#7ee0a8;} .py-cm{color:var(--dim);font-style:italic;}
  .py-dc{color:var(--amber);} .py-num{color:#f0b46b;} .py-fn{color:var(--blue);}

  .hint{font-size:11.5px;color:var(--muted);margin-top:12px;padding:8px 11px;border-radius:9px;
    background:#0d1430;border:1px dashed var(--line2);line-height:1.5;}
  .hint b{color:var(--accent);}
  .maphint{padding:0 16px 12px;font-size:11.5px;color:var(--muted);}
  .maphint b{color:var(--accent);}
  .modelnote{font-size:12.5px;color:var(--muted);line-height:1.55;}
  .modelnote code{color:var(--accent);background:#00000033;padding:1px 5px;border-radius:5px;font-size:11px;}

  .ucgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px;}
  .uc{background:#0d1430;border:1px solid var(--line);border-radius:10px;padding:11px 13px;}
  .uct{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.3;}
  .uct .em{opacity:.5;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;}
  .ucd{font-size:12px;color:var(--muted);line-height:1.45;}
  .whenuse{margin-top:12px;padding:12px 14px;border-radius:10px;background:#132a44;border:1px solid #2c4a70;
    font-size:12.5px;color:#d7e5ff;line-height:1.55;}
  .whenuse b{color:#8fb7ff;}

  /* --- técnicas + biblioteca --- */
  .techlist{display:flex;flex-direction:column;gap:8px;margin-top:8px;max-height:340px;overflow:auto;padding-right:4px;}
  .tech{background:#0d1430;border:1px solid var(--line);border-radius:9px;padding:9px 11px;}
  .techt{font-size:12.5px;font-weight:700;color:var(--text);display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .techc{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;padding:1px 6px;border-radius:6px;border:1px solid var(--line2);}
  .techc.low{color:#7ee0a8;border-color:#2c6b4a;}
  .techc.medium{color:#f0c674;border-color:#7a6220;}
  .techc.high{color:#ff8a8a;border-color:#7a3030;}
  .techd{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:4px;}

  .libwrap{padding:6px 22px 40px;}
  .libbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 18px;}
  .libsearch{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;
    color:var(--text);padding:10px 14px;font-size:13.5px;outline:none;}
  .libsearch:focus{border-color:var(--accent);}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg .s{cursor:pointer;padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:600;
    background:var(--panel);border:1px solid var(--line);color:var(--muted);transition:.15s;}
  .seg .s.on{background:linear-gradient(135deg,#233a7a,#2a1d57);color:#fff;border-color:#3c55a8;}
  .libcount{font-size:12px;color:var(--dim);}

  .catsec{margin-bottom:26px;}
  .cathead{display:flex;align-items:baseline;gap:10px;padding:6px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:12px;}
  .cathead h3{margin:0;font-size:16px;}
  .cathead .n{font-size:11.5px;color:var(--dim);}
  .catdesc{font-size:12px;color:var(--muted);margin-top:2px;}

  .libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;}
  .lcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;transition:.15s;cursor:pointer;}
  .lcard:hover{border-color:#4a5f9e;transform:translateY(-1px);}
  .lcard .lt{font-size:13.5px;font-weight:700;color:var(--text);display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .lcard .ld{font-size:12px;color:var(--muted);line-height:1.45;margin-top:6px;}
  .lcard .ltags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
  .ltag{font-size:10px;padding:2px 7px;border-radius:6px;background:#00000033;border:1px solid var(--line2);color:var(--muted);}
  .st-prod{color:#3ecf6e;border-color:#2c6b4a !important;background:#0d2317 !important;}
  .st-badge{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);}
  .lcard .sig{margin-top:9px;font-size:11px;color:var(--dim);line-height:1.4;}
  .lcard .sig b{color:var(--muted);}

  .libdetail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;}
  .libdetail h2{margin:0 0 4px;font-size:18px;}
  .libdetail .meta{font-size:11.5px;color:var(--dim);margin-bottom:12px;}
  .libdetail .desc{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:12px;}
  .libdetail h4{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}
  .libdetail ul{margin:0;padding-left:16px;}
  .libdetail li{font-size:12.5px;color:var(--muted);margin:4px 0;line-height:1.5;}
  .backlink{cursor:pointer;color:var(--accent);font-size:12.5px;font-weight:600;margin-bottom:12px;display:inline-block;}
  .backlink:hover{text-decoration:underline;}
  /* --- biblioteca agrupada + detalle --- */
  .groupnav{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 18px;}
  .gchip{cursor:pointer;font-size:12px;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);color:var(--muted);}
  .gchip:hover{color:var(--text);border-color:#4a5f9e;} .gchip small{color:var(--dim);margin-left:3px;}
  .grpsec{margin:10px 0 30px;}
  .grphead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:8px 0 10px;margin-bottom:14px;border-bottom:2px solid #2f3f72;}
  .grphead h2{margin:0;font-size:19px;color:#fff;} .grphead .es{font-size:13px;color:var(--teal);font-weight:600;}
  .grphead .n{font-size:11.5px;color:var(--dim);margin-left:auto;}
  .catsec{margin:0 0 22px 6px;padding-left:12px;border-left:2px solid var(--line);}
  .ld.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .lfoot{display:flex;justify-content:space-between;margin-top:10px;font-size:10.5px;color:var(--dim);}
  .enbadge{font-size:9px;padding:1px 5px;border-radius:5px;background:#3a2a10;color:#f5c26b;border:1px solid #6b4f1c;vertical-align:1px;}
  .techc.very-high{color:#ff6b9a;border-color:#7a2f4a;}
  .tech.clickable{cursor:pointer;} .tech.clickable:hover{border-color:#4a5f9e;}
  .dethead{margin:4px 0 14px;} .dethead h2{margin:4px 0 6px;font-size:22px;}
  .crumbs{font-size:12px;color:var(--teal);font-weight:600;} .dethead .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;}
  .dtabs{display:flex;gap:8px;margin:0 0 16px;border-bottom:1px solid var(--line);}
  .dtab{cursor:pointer;padding:10px 16px;font-size:13.5px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .dtab.on{color:#fff;border-bottom-color:var(--accent);} .dtab:hover{color:var(--text);}
  .ovcard{margin-bottom:14px;} .ovcard h4{margin:14px 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
  .ovcard p,.ovcard li{font-size:13px;line-height:1.6;color:#cdd6f4;} .ovcard .lead{font-size:14px;color:var(--text);}
  .ov2{display:grid;grid-template-columns:1fr 1fr;gap:14px;} .ov2.inner{gap:18px;} @media(max-width:820px){.ov2{grid-template-columns:1fr}}
  .tldr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;} @media(max-width:820px){.tldr{grid-template-columns:1fr}}
  .tldr>div{background:#0d1430;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .tldr h4{margin:0 0 4px;color:var(--teal);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;} .tldr p{margin:0;font-size:12.5px;line-height:1.55;color:#cdd6f4;}
  .kv30{display:flex;flex-direction:column;gap:6px;margin:6px 0;font-size:13px;line-height:1.55;}
  .kv30 b{color:var(--accent);}
  ul.plain,ul.checks,ul.okl,ul.badl,ol.impl{margin:0;padding-left:18px;}
  ul.checks li::marker{content:"✔  ";color:var(--green);} ul.okl li::marker{content:"✓  ";color:var(--green);} ul.badl li::marker{content:"✗  ";color:var(--red);}
  .metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .metrics>div{background:#0d1430;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;display:flex;flex-direction:column;gap:3px;}
  .metrics b{color:var(--text);} .metrics span{color:var(--muted);}
  .refs a,.md a{color:var(--accent);word-break:break-word;}
  .md code,.ovcard code{background:#00000040;padding:1px 5px;border-radius:5px;font-size:12px;color:#cfe0ff;}
  .md h5{margin:12px 0 4px;font-size:13px;color:var(--text);} .md blockquote{margin:6px 0;padding:6px 12px;border-left:3px solid var(--line2);color:var(--muted);}
  .mdt{border-collapse:collapse;margin:8px 0;font-size:12px;} .mdt th,.mdt td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;}
  .mdt th{background:#0d1430;color:var(--text);}
  pre.code{white-space:pre-wrap;}
  .btnrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .inph{margin:12px 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
  /* nodos de diagramas de la biblioteca */
  .dnode{width:100%;height:100%;box-sizing:border-box;border-radius:11px;border:1.5px solid var(--line2);border-left:4px solid var(--teal);
    background:var(--panel2);padding:8px 12px;overflow:hidden;cursor:pointer;transition:.15s;box-shadow:0 4px 14px #00000055;}
  .dnode:hover{border-color:#4a5f9e;}
  .dnode .dt{font-size:12px;font-weight:700;line-height:17px;color:var(--text);overflow-wrap:anywhere;}
  .dnode .ds{font-size:11px;line-height:15px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere;}
  .dnode.c-input{border-left-color:var(--slate);} .dnode.c-output{border-left-color:var(--green);}
  .dnode.c-decision{border-left-color:var(--amber);} .dnode.c-store{border-left-color:var(--purple);}
  .dnode.c-actor{border-left-color:var(--blue);text-align:center;}
  .dnode.c-note{background:#241f10;border:1px dashed #8a6d2a;border-left:1px dashed #8a6d2a;cursor:default;}
  .dnode.c-note .ds{color:#e8d5a3;margin-top:0;}
  .dnode.is-active{border-color:var(--accent);box-shadow:0 0 0 3px #7aa2ff33,0 0 24px #4d8dff55;}
  .dnode.is-active .dt{color:#fff;}
  .lifeline{stroke:#33406e;stroke-width:1.5;stroke-dasharray:5 5;}
  .sqframe{fill:#7aa2ff08;stroke:#4b5a8c;stroke-width:1.2;stroke-dasharray:4 3;}
  .sqtag{fill:#1c2850;stroke:#4b5a8c;} .sqtagt{font-size:10.5px;font-weight:700;fill:#b9c7f0;}
  .sqelse{stroke:#4b5a8c;stroke-dasharray:4 3;}


  .concepts{margin-top:2px;}
  .concepts li{font-size:12.5px;color:var(--muted);margin:5px 0;line-height:1.4;}
  .concepts b{color:var(--text);}

  .overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:8px 22px 40px;}
  .ocard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.15s;}
  .ocard:hover{border-color:#4a5f9e;transform:translateY(-2px);}
  .ocard .big{font-size:26px;}
  .ocard h3{margin:10px 0 4px;font-size:16px;}
  .ocard .adds{font-size:12px;color:var(--teal);font-weight:700;margin:2px 0 8px;}
  .ocard p{font-size:13px;color:var(--muted);margin:0;line-height:1.5;}
  .ocard .numb{font-size:11px;color:var(--dim);}
  .tooltip{position:fixed;pointer-events:none;z-index:50;max-width:280px;background:#0c1330;border:1px solid #3c55a8;
    border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text);box-shadow:0 8px 30px #000;opacity:0;transition:opacity .1s;}
  .tooltip b{color:var(--accent);}
  .tooltip .ttmodel{color:var(--muted);font-size:11px;}

  /* ============================================================
     HOME · estética terminal (tokens de la skill "mono")
     ============================================================ */
  @font-face{font-family:"Space Mono";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/space-mono-400.woff2") format("woff2");}
  @font-face{font-family:"Space Mono";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/space-mono-700.woff2") format("woff2");}
  @font-face{font-family:"JetBrains Mono";font-weight:400 700;font-style:normal;font-display:swap;src:url("fonts/jetbrains-mono.woff2") format("woff2");}
  :root{
    --m-primary:#37F712; --m-secondary:#00A6F4; --m-success:#00A63D; --m-warning:#FE9900; --m-danger:#FF2157;
    --m-bg:#050806; --m-panel:#090e0a; --m-panel2:#0d140e; --m-line:#1b2a1d; --m-line2:#2b4430;
    --m-fg:#d9e8d6; --m-soft:#a3b3a0; --m-dim:#7f907c;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --display:"Space Mono","JetBrains Mono",ui-monospace,monospace;
  }

  /* barra superior en clave terminal */
  .topbar .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;border-radius:8px;}
  .topbar .brand:focus-visible{outline:2px solid var(--m-primary);outline-offset:4px;}
  .topbar .logo{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);
    font-size:15px;font-weight:700;color:var(--m-primary);background:var(--m-bg);border:1px solid var(--m-line2);}
  .topbar h1{font-family:var(--display);font-size:19px;letter-spacing:-.2px;}

  .home{font-family:var(--mono);color:var(--m-fg);background:var(--m-bg);font-size:13.5px;line-height:1.6;
    padding:0 22px 40px;position:relative;}
  .home *::selection{background:var(--m-primary);color:#000;}
  .home a{color:var(--m-secondary);}
  .home :focus-visible{outline:2px solid var(--m-primary);outline-offset:2px;}

  .h-status{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:11.5px;color:var(--m-soft);
    border:1px solid var(--m-line);border-left:3px solid var(--m-primary);background:var(--m-panel);padding:7px 12px;margin:4px 0 26px;}
  .h-status .led{width:8px;height:8px;border-radius:50%;background:var(--m-primary);box-shadow:0 0 8px var(--m-primary);}
  .h-status .sep{color:var(--m-line2);}
  .h-status b{color:var(--m-fg);font-weight:700;}
  .h-status .right{margin-left:auto;color:var(--m-dim);}

  .h-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;}
  @media(max-width:980px){.h-grid{grid-template-columns:minmax(0,1fr)}.h-grid>*{grid-column:1/-1 !important;min-width:0}}

  /* paneles con marcas de esquina */
  .h-panel{position:relative;background:var(--m-panel);border:1px solid var(--m-line);padding:16px 18px;}
  .h-panel::before,.h-panel::after{content:"";position:absolute;width:10px;height:10px;border-color:var(--m-primary);border-style:solid;}
  .h-panel::before{top:-1px;left:-1px;border-width:2px 0 0 2px;}
  .h-panel::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}
  .h-ptitle{display:flex;justify-content:space-between;gap:10px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--m-dim);border-bottom:1px dashed var(--m-line2);padding-bottom:8px;margin-bottom:12px;}
  .h-ptitle b{color:var(--m-primary);font-weight:700;}

  /* hero */
  .h-hero-l{grid-column:1/8;padding:6px 0 0;}
  .h-term{grid-column:8/13;}
  .h-prompt{font-size:13px;color:var(--m-soft);margin-bottom:14px;}
  .h-prompt .u{color:var(--m-primary);} .h-prompt .p{color:var(--m-secondary);}
  .h-title{font-family:var(--display);font-weight:700;font-size:clamp(38px,6.2vw,76px);line-height:.98;letter-spacing:-2px;
    margin:0 0 20px;color:var(--m-fg);}
  .h-title .acc{color:var(--m-primary);}
  .h-cursor{display:inline-block;width:.5em;height:.82em;background:var(--m-primary);margin-left:8px;vertical-align:-.06em;
    animation:hblink 1.1s steps(1) infinite;}
  @keyframes hblink{50%{opacity:0}}
  .h-lede{max-width:62ch;color:var(--m-soft);font-size:14px;margin:0 0 10px;}
  .h-lede b{color:var(--m-fg);}
  .h-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}
  .h-btn{font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer;padding:11px 16px;min-height:44px;
    background:transparent;color:var(--m-fg);border:1px solid var(--m-line2);border-radius:0;transition:background .12s,color .12s,border-color .12s;}
  .h-btn:hover{border-color:var(--m-primary);color:var(--m-primary);}
  .h-btn.primary{background:var(--m-primary);color:#031003;border-color:var(--m-primary);}
  .h-btn.primary:hover{background:#7dff63;color:#031003;}
  .h-btn .k{opacity:.7;margin-right:6px;}

  /* terminal agent.log */
  .h-termwin{background:#020403;border:1px solid var(--m-line2);height:100%;display:flex;flex-direction:column;min-height:380px;}
  .h-termbar{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--m-line2);font-size:11px;color:var(--m-dim);}
  .h-termbar .dots{display:flex;gap:5px;} .h-termbar .dots i{width:9px;height:9px;border:1px solid var(--m-line2);display:block;}
  .h-termbar .t{color:var(--m-soft);} .h-termbar button{margin-left:auto;font-family:var(--mono);font-size:11px;cursor:pointer;
    background:none;border:1px solid var(--m-line2);color:var(--m-soft);padding:3px 8px;min-height:26px;}
  .h-termbar button:hover{color:var(--m-primary);border-color:var(--m-primary);}
  .h-log{margin:0;padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.7;white-space:pre-wrap;color:var(--m-soft);flex:1;overflow:hidden;}
  .h-log .ts{color:#4d5f4b;} .h-log .ok{color:var(--m-primary);} .h-log .in{color:var(--m-secondary);}
  .h-log .wr{color:var(--m-warning);} .h-log .er{color:var(--m-danger);} .h-log .hl{color:var(--m-fg);font-weight:700;}

  /* secciones */
  .h-sec{margin-top:44px;}
  .h-sech{display:flex;align-items:baseline;gap:14px;margin:0 0 16px;font-family:var(--display);}
  .h-sech .n{color:var(--m-primary);font-size:13px;} .h-sech h3{margin:0;font-size:20px;letter-spacing:-.3px;color:var(--m-fg);}
  .h-sech .rule{flex:1;border-bottom:1px dashed var(--m-line2);transform:translateY(-4px);}
  .h-sech .meta{font-family:var(--mono);font-size:11px;color:var(--m-dim);}

  /* módulos (asimétricos) */
  .h-mod{display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .12s,background .12s;}
  .h-mod:hover{border-color:var(--m-line2);background:var(--m-panel2);}
  .h-mod .idx{font-size:11px;color:var(--m-primary);}
  .h-mod h4{margin:0;font-family:var(--display);font-size:17px;color:var(--m-fg);}
  .h-mod p{margin:0;color:var(--m-soft);font-size:12.5px;}
  .h-mod .go{margin-top:auto;font-size:12px;color:var(--m-secondary);}
  .h-mod pre{overflow-x:auto;margin:6px 0 0;font-size:11px;line-height:1.45;color:var(--m-dim);white-space:pre;overflow:hidden;}
  .h-mod pre .g{color:var(--m-primary);} .h-mod pre .b{color:var(--m-secondary);} .h-mod pre .a{color:var(--m-warning);}

  /* anatomía de un paso */
  .h-anat pre{margin:0;font-size:12px;line-height:1.5;color:var(--m-soft);overflow-x:auto;white-space:pre;}
  .h-anat pre .g{color:var(--m-primary);} .h-anat pre .b{color:var(--m-secondary);} .h-anat pre .r{color:var(--m-danger);} .h-anat pre .a{color:var(--m-warning);}
  .h-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 18px;margin-top:14px;font-size:12.5px;color:var(--m-soft);}
  .h-legend b{color:var(--m-fg);}

  /* índice numérico */
  .h-stats{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--m-line);}
  @media(max-width:980px){.h-stats{grid-template-columns:repeat(3,1fr)}}
  .h-stats>div{padding:14px 14px 12px;border-right:1px solid var(--m-line);border-bottom:1px solid var(--m-line);background:var(--m-panel);}
  .h-stats .v{font-family:var(--display);font-size:32px;font-weight:700;color:var(--m-primary);line-height:1.05;}
  .h-stats .l{font-size:11px;color:var(--m-soft);text-transform:uppercase;letter-spacing:.8px;}

  /* árbol de taxonomía */
  .h-tree{font-size:12.5px;line-height:1.75;color:var(--m-soft);overflow-x:auto;margin:0;}
  .h-tree .grp{color:var(--m-fg);font-weight:700;cursor:pointer;}
  .h-tree .grp:hover{color:var(--m-primary);}
  .h-tree .es{color:var(--m-dim);font-weight:400;}
  .h-tree .br{color:var(--m-line2);} .h-tree .c{color:var(--m-secondary);} .h-tree .n{color:var(--m-dim);}
  .h-tree button.grp{background:none;border:0;padding:0;font:inherit;text-align:left;}

  /* atajos */
  .h-keys{width:100%;border-collapse:collapse;font-size:12.5px;}
  .h-keys td{padding:7px 8px;border-bottom:1px dashed var(--m-line);vertical-align:top;color:var(--m-soft);}
  .h-keys td:first-child{white-space:nowrap;width:1%;}
  kbd{font-family:var(--mono);font-size:11px;color:var(--m-fg);background:var(--m-panel2);border:1px solid var(--m-line2);
    border-bottom-width:2px;padding:1px 6px;}

  .h-src li{color:var(--m-soft);font-size:12.5px;margin:4px 0;} .h-src ul{margin:0;padding-left:18px;}
  .h-eof{margin-top:40px;padding-top:12px;border-top:1px dashed var(--m-line2);display:flex;justify-content:space-between;
    flex-wrap:wrap;gap:8px;font-size:11px;color:var(--m-dim);}

  @media (prefers-reduced-motion: reduce){ .h-cursor{animation:none;} }

  /* ============================================================
     TEMA TERMINAL GLOBAL (skill "mono") — se aplica a toda la app.
     Redefine las variables base y reemplaza esquinas redondeadas,
     degradados y sombras de la versión anterior.
     ============================================================ */
  :root{
    --bg:#050806; --panel:#090e0a; --panel2:#0d140e; --line:#1b2a1d; --line2:#2b4430;
    --text:#d9e8d6; --muted:#a3b3a0; --dim:#7f907c;
    --accent:#37F712;                          /* activo / foco / resaltado */
    --blue:#00A6F4;  --teal:#2DE2C5; --purple:#B47CFF; --pink:#FF4FA3;   /* tipos de nodo */
    --green:#00C24A; --amber:#FE9900; --slate:#8C9A89; --red:#FF2157;
  }
  html,body{font-family:var(--mono);background:var(--bg);}
  body{background:var(--bg);font-size:13px;}
  ::selection{background:var(--m-primary);color:#000;}
  :focus-visible{outline:2px solid var(--m-primary);outline-offset:2px;}
  h1,h2,h3,.cathead h3,.grphead h2,.dethead h2,.mapcard .head h2{font-family:var(--display);letter-spacing:-.2px;}

  /* barra de ruta tipo prompt */
  .pathbar{font-size:12px;color:var(--muted);padding:2px 22px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pathbar .u{color:var(--m-primary);} .pathbar .p{color:var(--m-secondary);} .pathbar .c{color:var(--dim);}

  /* pestañas = menú de terminal */
  .tabs{gap:6px;padding:4px 22px 14px;}
  .tab{font-family:var(--mono);font-size:12px;font-weight:700;border-radius:0;padding:7px 11px;background:var(--panel);
    border:1px solid var(--line);color:var(--muted);}
  .tab:hover{border-color:var(--line2);color:var(--text);}
  .tab.active{background:var(--m-primary);color:#031003;border-color:var(--m-primary);}
  .tab .n{background:transparent;border-radius:0;padding:0;margin-right:7px;color:var(--dim);font-size:11px;}
  .tab.active .n{color:#031003;opacity:.75;}

  /* paneles: esquinas rectas, sin sombras ni degradados, con marcas de esquina */
  .card,.mapcard,.ocard,.lcard,.libdetail,.tech,.uc,.box,.tldr>div,.metrics>div,.codeview,.code,.hint,.whenuse,
  .h-panel,.libsearch,.seg .s,.gchip,.badge,.techc,.st-badge,.ltag,.enbadge,.btn,.progress,.dot,.codeview .cline{border-radius:0 !important;}
  .card,.mapcard,.ocard,.libdetail{position:relative;background:var(--panel);border:1px solid var(--line);box-shadow:none;}
  .card::before,.card::after,.mapcard::before,.mapcard::after,.ocard::before,.ocard::after{content:"";position:absolute;width:10px;height:10px;
    border-color:var(--m-primary);border-style:solid;pointer-events:none;z-index:1;}
  .card::before,.mapcard::before,.ocard::before{top:-1px;left:-1px;border-width:2px 0 0 2px;}
  .card::after,.mapcard::after,.ocard::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}
  .card h3{color:var(--dim);font-family:var(--mono);font-size:11.5px;letter-spacing:1.2px;}
  .card h3::before{content:"// ";color:var(--m-primary);}
  .mapcard .head{border-bottom:1px dashed var(--line2);}
  .mapcard .head h2{font-size:15px;} .mapcard .head .tag{color:var(--dim);font-family:var(--mono);}
  .pnum{color:var(--m-primary);margin-right:4px;}
  .legend{font-family:var(--mono);} .legend i{border-radius:0;}
  .controls{border-top:1px dashed var(--line2);}
  .maphint,.hint{color:var(--muted);} .maphint b,.hint b{color:var(--m-primary);}
  .hint{background:var(--panel2);border:1px dashed var(--line2);}

  /* botones */
  .btn{font-family:var(--mono);font-size:12px;background:transparent;border:1px solid var(--line2);color:var(--text);min-height:36px;}
  .btn:hover{border-color:var(--m-primary);color:var(--m-primary);}
  .btn.primary{background:var(--m-primary);border-color:var(--m-primary);color:#031003;}
  .btn.primary:hover{background:#7dff63;color:#031003;}
  .progress{background:var(--line);height:6px;} .progress .fill{background:var(--m-primary);}
  .dot{background:var(--line2);} .dot.on{background:var(--m-primary);transform:none;outline:2px solid #37F71255;outline-offset:2px;}
  .dot.done{background:#1f5c1a;}
  .stepinfo{font-family:var(--mono);color:var(--muted);}

  /* nodos de los mapas y de los diagramas */
  .node,.dnode{border-radius:2px;background:var(--panel2);border-color:var(--line2);box-shadow:none;font-family:var(--mono);}
  .node:hover{transform:none;border-color:var(--dim);} .dnode:hover{border-color:var(--dim);}
  .node .nh{font-size:12px;} .node .nh .ic{display:none;}
  .node .ns{font-size:10.5px;color:var(--muted);} .node .nm{font-size:9.5px;color:var(--dim);}
  .node.is-active,.dnode.is-active{border-color:var(--m-primary);box-shadow:0 0 0 1px var(--m-primary),0 0 18px #37F71244;}
  .node.is-active .nh,.dnode.is-active .dt{color:var(--m-primary);}
  .edge{stroke:#2f4a33;} .ahead{fill:#2f4a33;}
  .edge.active{stroke:var(--m-primary);} .ahead-a{fill:var(--m-primary);}
  .flowdot{fill:#dfffd6;filter:drop-shadow(0 0 5px var(--m-primary));}
  .edge-label{font-family:var(--mono);font-size:10.5px;font-weight:700;fill:var(--text);}
  .lblplate{fill:#030604;stroke:var(--line2);rx:2px;}
  .dnode.c-note{background:#1d1608;border:1px dashed #7a5a14;border-left:1px dashed #7a5a14;}
  .dnode.c-note .ds{color:#ffd28a;}
  .lifeline{stroke:#2b4430;} .sqframe{fill:#37F71206;stroke:#2b4430;} .sqtag{fill:#0d140e;stroke:#2b4430;}
  .sqtagt{font-family:var(--mono);fill:var(--muted);} .sqelse{stroke:#2b4430;}
  .tooltip{border-radius:0;background:#020403;border:1px solid var(--m-primary);font-family:var(--mono);box-shadow:none;}
  .tooltip b{color:var(--m-primary);}

  /* tarjeta del paso */
  .card .phase{color:var(--m-warning);font-family:var(--mono);}
  .card .component{color:var(--m-secondary);}
  .badge{font-family:var(--mono);background:transparent;}
  .badge.model{color:var(--m-secondary);border-color:#00A6F455;}
  .badge.tool{color:var(--purple);border-color:#B47CFF55;}
  .badge.event{color:var(--m-primary);border-color:#37F71255;}
  .box{background:var(--panel2);} .box.before{background:#140709;border-color:#5a1a26;} .box.after{background:#06140a;border-color:#1f5c2a;}
  .box.before h4{color:var(--m-danger);} .box.after h4{color:var(--m-primary);}

  /* visor de código */
  .codetitle{font-family:var(--mono);color:var(--muted);} .codetitle b{color:var(--m-primary);}
  .codeview,.code,pre.code{background:#020403;border-color:var(--line);}
  .cline .ln{color:#4d5f4b;border-right-color:var(--line);}
  .cline .lc{color:#c4d6c0;}
  .cline.hl{background:#0f2a10;} .cline.hl .ln{color:var(--m-primary);} .cline.hl .lc{color:#f0fff0;}
  .cline.hl::before{background:var(--m-primary);}
  .py-kw{color:#00A6F4;} .py-str{color:#9CFF7D;} .py-cm{color:#5f7a5c;} .py-dc{color:var(--m-warning);}
  .py-num{color:var(--m-warning);} .py-fn{color:var(--teal);}
  .code .kw{color:#00A6F4;} .code .fn{color:var(--teal);} .code .str{color:#9CFF7D;} .code .cm{color:#5f7a5c;}

  /* vista general */
  .ocard{padding:16px 18px;} .ocard:hover{transform:none;border-color:var(--line2);background:var(--panel2);}
  .ocard .big{font-family:var(--display);font-size:28px;font-weight:700;color:var(--m-primary);line-height:1;}
  .ocard h3{font-family:var(--display);} .ocard .adds{color:var(--m-secondary);} .ocard .numb{color:var(--dim);}
  .ocard p{color:var(--muted);}

  /* biblioteca */
  .libsearch{font-family:var(--mono);background:#020403;border:1px solid var(--line2);color:var(--text);}
  .libsearch:focus{border-color:var(--m-primary);}
  .seg .s{font-family:var(--mono);font-size:12px;background:var(--panel);}
  .seg .s.on{background:var(--m-primary);border-color:var(--m-primary);color:#031003;}
  .gchip{font-family:var(--mono);background:transparent;} .gchip:hover{border-color:var(--m-primary);color:var(--m-primary);}
  .grphead{border-bottom:1px dashed var(--line2);} .grphead h2{color:var(--text);}
  .grphead h2::before{content:"## ";color:var(--m-primary);}
  .grphead .es{color:var(--m-secondary);font-family:var(--mono);}
  .cathead h3::before{content:"> ";color:var(--m-primary);}
  .catsec{border-left:1px dashed var(--line2);}
  .lcard{background:var(--panel);border:1px solid var(--line);} .lcard:hover{transform:none;border-color:var(--m-primary);background:var(--panel2);}
  .tech{background:var(--panel2);border-color:var(--line);} .tech.clickable:hover{border-color:var(--m-primary);}
  .uc{background:var(--panel2);} .whenuse{background:#06140a;border-color:#1f5c2a;color:var(--text);} .whenuse b{color:var(--m-primary);}
  .tldr>div,.metrics>div{background:var(--panel2);} .tldr h4{color:var(--m-secondary);}
  .kv30 b{color:var(--m-primary);}
  .techc.low{color:var(--m-primary);border-color:#1f5c2a;} .techc.medium{color:var(--m-warning);border-color:#6b4a10;}
  .techc.high{color:var(--m-danger);border-color:#5a1a26;} .techc.very-high{color:var(--pink);border-color:#5a1a40;}
  .st-prod{color:var(--m-primary) !important;border-color:#1f5c2a !important;background:#06140a !important;}
  .enbadge{background:#2a1c04;color:var(--m-warning);border-color:#6b4a10;}

<script type="text/plain" id="src-chaining">"""
Prompt Chaining — "The Tech Blog Assembly Line"

Demonstrates decomposing a task into a sequence of fixed steps, where each LLM call
processes the output of the previous one. A topic flows through Outliner → Writer → Editor.
"""

from collections.abc import Callable
from pathlib import Path
from typing import Any, cast

import anthropic
from dotenv import find_dotenv, load_dotenv
from rich.console import Console
from rich.markdown import Markdown
from rich.panel import Panel

from common import AnthropicTokenTracker, interactive_menu, setup_logging

load_dotenv(find_dotenv())
logger = setup_logging(__name__)

OUTPUT_DIR = Path("output")
MODEL = "claude-sonnet-4-6"
LIGHT_MODEL = "claude-haiku-4-5-20251001"

# Anthropic server-side web search tool — Claude decides when to search
WEB_SEARCH_TOOL = {"type": "web_search_20250305", "name": "web_search", "max_uses": 1}

SUGGESTED_TOPICS = [
    "Practical Async Programming in Python",
    "AI Agents in Production",
    "WebAssembly Beyond the Browser",
    "Zero-Trust Security for Startups",
]


# --- Prompts ---

OUTLINER_SYSTEM_PROMPT = (
    "You are a research planner. Given a topic, identify 3-5 broad research areas that "
    "cover distinct dimensions of the subject — market landscape, technical depth, "
    "adoption patterns, performance analysis, etc. Each area should be independently "
    "researchable. Output the topic title on the first line, then the research areas "
    "as bullet points. Keep area names short and high-level. No extra commentary."
)
OUTLINER_USER_PROMPT = "Create a blog outline for: {topic}"

WRITER_SYSTEM_PROMPT = (
    "You are a technical blog writer. Given an outline (title + bullet points), write a "
    "concise blog post. Use the title as an H1 heading and each bullet point as an H2 "
    "section. Write 1-2 short paragraphs per section — no filler, no fluff. "
    "Use a professional but approachable tone. Aim for under 1000 words total. "
    "Always use web search to ground your writing with current, accurate information."
)
WRITER_USER_PROMPT = "Write a full blog post from this outline:\n\n{outline}"

EDITOR_SYSTEM_PROMPT = (
    "You are a professional editor. Polish the given blog post for grammar, clarity, and "
    "flow. At the end, add a '## Key Takeaways' section with 3-5 bullet points summarizing "
    "the main insights. Return the complete edited post."
)
EDITOR_USER_PROMPT = "Edit and polish this blog post:\n\n{draft}"

# Callback type: agent emits (event_name, event_data) — caller decides how to display
ChainCallback = Callable[[str, dict[str, Any]], None]


class PromptChain:
    """Sequential chain of LLM calls where each step feeds into the next."""

    def __init__(self, model: str, light_model: str, token_tracker: AnthropicTokenTracker):
        self.client = anthropic.Anthropic()
        self.model = model
        self.light_model = light_model
        self.token_tracker = token_tracker
        self._notify: ChainCallback = lambda _e, _d: None

    def _call_llm(
        self,
        system: str,
        messages: list[dict[str, Any]],
        *,
        use_light: bool = False,
        max_tokens: int = 4096,
        tools: list[dict[str, Any]] | None = None,
    ) -> anthropic.types.Message:
        """Single LLM call with token tracking."""
        model = self.light_model if use_light else self.model
        kwargs: dict[str, Any] = {}
        if tools:
            kwargs["tools"] = tools
        tool_names = [t.get("name", t.get("type", "unknown")) for t in tools or []]
        logger.info("Calling %s, tools=%s", model, tool_names)

        response = self.client.messages.create(
            model=model,
            max_tokens=max_tokens,
            system=system,
            messages=messages,
            **kwargs,
        )
        self.token_tracker.track(response.usage)
        return response

    def _call_llm_text(self, system: str, user_message: str) -> str:
        """Call LLM and return the text content."""
        messages: list[dict[str, Any]] = [{"role": "user", "content": user_message}]
        return cast(str, self._call_llm(system, messages).content[0].text)

    def _run_agentic_loop(
        self,
        system: str,
        user_message: str,
        *,
        use_light: bool = False,
        tools: list[dict[str, Any]] | None = None,
    ) -> tuple[str, list[dict[str, str]]]:
        """Run LLM with tool use, continuing across multiple turns if needed."""
        messages: list[dict[str, Any]] = [{"role": "user", "content": user_message}]
        searches: list[dict[str, str]] = []

        response = self._call_llm(system, messages, use_light=use_light, tools=tools)

        for _ in range(4):
            # Collect search results from this turn
            for block in response.content:
                if block.type == "web_search_tool_result" and isinstance(block.content, list):
                    for result in block.content:
                        searches.append({"title": result.title, "url": result.url})

            if response.stop_reason == "end_turn":
                break

            # Continue the conversation with tool results
            messages.append({"role": "assistant", "content": response.content})
            tool_results = [
                {"type": "tool_result", "tool_use_id": b.id, "content": "Search completed."}
                for b in response.content
                if b.type == "tool_use"
            ]
            if not tool_results:
                break
            messages.append({"role": "user", "content": tool_results})

            response = self._call_llm(system, messages, use_light=use_light, tools=tools)

        text_parts = [b.text for b in response.content if b.type == "text"]
        return "\n\n".join(text_parts), searches

    def _step_outline(self, topic: str) -> str:
        """Step 1: Generate a structured outline with title and bullet points."""
        return self._call_llm_text(OUTLINER_SYSTEM_PROMPT, OUTLINER_USER_PROMPT.format(topic=topic))

    def _step_write(self, outline: str) -> tuple[str, list[dict[str, str]]]:
        """Step 2: Expand the outline into a full blog post, optionally using web search."""
        return self._run_agentic_loop(
            WRITER_SYSTEM_PROMPT,
            WRITER_USER_PROMPT.format(outline=outline),
            use_light=True,
            tools=[WEB_SEARCH_TOOL],
        )

    def _step_edit(self, draft: str) -> str:
        """Step 3: Polish the draft and add a Key Takeaways section."""
        return self._call_llm_text(EDITOR_SYSTEM_PROMPT, EDITOR_USER_PROMPT.format(draft=draft))

    def run(self, topic: str, on_event: ChainCallback | None = None) -> str:
        """Execute the full chain: Outline → Write → Edit."""
        self._notify = on_event or (lambda _e, _d: None)

        # Step 1: Outline
        self._notify("step_start", {"name": "Outline"})
        outline = self._step_outline(topic)
        if not outline.strip():
            raise ValueError("Outliner produced empty output — aborting chain.")
        self.token_tracker.report()
        self._notify("step_complete", {"name": "Outline", "result": outline})

        # Step 2: Write
        self._notify("step_start", {"name": "Write"})
        logger.info("[Write] Calling %s", self.light_model)
        draft, searches = self._step_write(outline)
        self.token_tracker.report()
        self._notify("step_complete", {"name": "Write", "searches": searches})

        # Step 3: Edit
        self._notify("step_start", {"name": "Edit"})
        final = self._step_edit(draft)
        self.token_tracker.report()
        self._notify("step_complete", {"name": "Edit"})

        self._notify("chain_complete", {})
        return final


def main() -> None:
    """Run the prompt chaining demo."""
    console = Console()
    token_tracker = AnthropicTokenTracker()

    def on_chain_event(event: str, data: dict[str, Any]) -> None:
        """Print step progress to console."""
        if event == "step_start":
            console.print(f"  [cyan]{data['name']}...[/cyan]")
        elif event == "step_complete":
            console.print("  [green]✓[/green] Done")
            if data["name"] == "Outline" and data.get("result"):
                console.print(Panel(data["result"], title="Outline", border_style="dim"))
            if data["name"] == "Write" and data.get("searches"):
                lines = [
                    f"  [dim]•[/dim] [link={s['url']}]{s['title']}[/link]" for s in data["searches"]
                ]
                console.print(Panel("\n".join(lines), title="Sources", border_style="dim"))

    header = Panel(
        "[bold cyan]Prompt Chaining — The Tech Blog Assembly Line[/bold cyan]\n\n"
        "Topic → [Outliner] → [Writer] → [Editor] → Final Post\n\n"
        "Each step feeds its output to the next.",
        title="Prompt Chaining",
    )

    try:
        while True:
            topic = interactive_menu(
                console,
                SUGGESTED_TOPICS,
                title="Select a Topic",
                header=header,
                allow_custom=True,
                custom_prompt="Enter your topic",
            )
            if not topic:
                break

            console.print(f"\n[bold green]Topic:[/bold green] {topic}")
            chain = PromptChain(MODEL, LIGHT_MODEL, token_tracker)

            try:
                result = chain.run(topic, on_event=on_chain_event)

                # Save article to output directory
                OUTPUT_DIR.mkdir(exist_ok=True)
                slug = topic.lower().replace(" ", "_")[:50]
                path = OUTPUT_DIR / f"{slug}.md"
                path.write_text(result, encoding="utf-8")

                console.print("\n[bold blue]Final Article:[/bold blue]")
                console.print(Markdown(result))
                abs_path = path.resolve()
                console.print(f"\n[dim]Saved to [link=file://{abs_path}]{path}[/link][/dim]")

                console.print("\n[dim]Press Enter to continue...[/dim]")
                input()
            except Exception as e:
                logger.error("Chain failed: %s", e)
                console.print(f"\n[red]Error: {e}[/red]")
            finally:
                token_tracker.reset()

    except KeyboardInterrupt:
        console.print("\n[yellow]Interrupted.[/yellow]")


if __name__ == "__main__":
    main()
</script>
<script type="text/plain" id="src-routing">"""
Routing — "The Content Strategist"

Demonstrates routing to specialized handlers based on content classification.
An LLM classifier determines content type, then dispatches to the appropriate
specialized chain (Tutorial, News, or Concept Explainer).
"""

from collections.abc import Callable
from pathlib import Path
from typing import Any, cast

import anthropic
from dotenv import find_dotenv, load_dotenv
from rich.console import Console
from rich.markdown import Markdown
from rich.panel import Panel

from common import AnthropicTokenTracker, interactive_menu, setup_logging

load_dotenv(find_dotenv())
logger = setup_logging(__name__)

OUTPUT_DIR = Path("output")
MODEL = "claude-sonnet-4-6"
LIGHT_MODEL = "claude-haiku-4-5-20251001"

SUGGESTED_TOPICS = [
    "How to deploy a FastAPI app on AWS Lambda",
    "Python 3.13 removed the GIL",
    "What is retrieval-augmented generation (RAG)",
    "How to set up CI/CD with GitHub Actions",
]

# --- Classification schema for structured output ---

CLASSIFY_TOOLS = [
    {
        "name": "classify_content",
        "description": "Classify the content type of a given topic.",
        "input_schema": {
            "type": "object",
            "properties": {
                "content_type": {
                    "type": "string",
                    "enum": ["tutorial", "news", "concept"],
                    "description": (
                        "tutorial: how-to guides (e.g. 'How to install Docker'). "
                        "news: announcements or changes (e.g. 'Docker changed its licensing'). "
                        "concept: explanations of ideas (e.g. 'What is containerization')."
                    ),
                },
                "reasoning": {
                    "type": "string",
                    "description": "Brief explanation of why this classification was chosen.",
                },
            },
            "required": ["content_type", "reasoning"],
        },
    }
]

# --- Prompts ---

CLASSIFY_SYSTEM_PROMPT = "Classify the following topic into one of: tutorial, news, or concept."

# Route chain steps

# Tutorial route
TUTORIAL_PREREQS_PROMPT = (
    "You are a technical writer. List the prerequisites needed before starting this "
    "tutorial. Be specific about versions and tools. Output a bulleted list."
)
TUTORIAL_STEPS_PROMPT = (
    "You are a technical writer. Given these prerequisites and a topic, write a clear "
    "step-by-step guide. Number each step. Include code examples where relevant."
)
TUTORIAL_TROUBLESHOOTING_PROMPT = (
    "You are a technical support writer. Given a tutorial, add a troubleshooting section "
    "with 3-5 common issues and their solutions. Format as '### Problem' / '**Solution**'."
)

# News route
NEWS_SUMMARY_PROMPT = (
    "You are a tech journalist. Summarize the key changes or news. Be factual and concise. "
    "Use bullet points for each distinct change."
)
NEWS_IMPACT_PROMPT = (
    "You are a technology analyst. Given this summary of changes, analyze the impact on "
    "developers and teams. Cover: who is affected, what changes, migration considerations."
)
NEWS_CTA_PROMPT = (
    "You are a tech editor. Given the news and impact analysis, write a brief call to "
    "action section telling readers what they should do next. Be specific and actionable."
)

# Concept route
CONCEPT_ANALOGY_PROMPT = (
    "You are a tech educator. Explain the given concept using a clear, relatable analogy. "
    "Start with the analogy, then bridge to the technical concept."
)
CONCEPT_ARCHITECTURE_PROMPT = (
    "You are a software architect. Given the concept introduction, describe the technical "
    "architecture in detail. Include how components interact and common implementations."
)
CONCEPT_PROS_CONS_PROMPT = (
    "You are a pragmatic engineer. Given the concept and architecture, list the pros and "
    "cons. Be honest about trade-offs. Format as two bullet lists."
)

# Callback type: router emits (event_name, event_data) — caller decides how to display
RouterCallback = Callable[[str, dict[str, Any]], None]


class ContentRouter:
    """Routes topics to specialized content generation chains based on classification."""

    def __init__(self, model: str, light_model: str, token_tracker: AnthropicTokenTracker):
        self.client = anthropic.Anthropic()
        self.model = model
        self.light_model = light_model
        self.token_tracker = token_tracker
        self._notify: RouterCallback = lambda _e, _d: None

    def _call_llm(
        self,
        system: str,
        messages: list[dict[str, Any]],
        *,
        use_light: bool = False,
        max_tokens: int = 4096,
        tools: list[dict[str, Any]] | None = None,
        tool_choice: dict[str, str] | None = None,
    ) -> anthropic.types.Message:
        """Single LLM call with token tracking."""
        model = self.light_model if use_light else self.model
        kwargs: dict[str, Any] = {}
        if tools:
            kwargs["tools"] = tools
        if tool_choice:
            kwargs["tool_choice"] = tool_choice
        tool_names = [t.get("name", t.get("type", "unknown")) for t in tools or []]
        logger.info("Calling %s, tools=%s", model, tool_names)
        response = self.client.messages.create(
            model=model,
            max_tokens=max_tokens,
            system=system,
            messages=messages,
            **kwargs,
        )
        self.token_tracker.track(response.usage)
        return response

    def _call_llm_text(self, system: str, user_message: str, *, use_light: bool = False) -> str:
        """Call LLM and return the text content."""
        messages: list[dict[str, Any]] = [{"role": "user", "content": user_message}]
        return cast(str, self._call_llm(system, messages, use_light=use_light).content[0].text)

    def _classify(self, topic: str) -> dict[str, str]:
        """Classify the topic using tool-based structured output (Haiku)."""
        messages: list[dict[str, Any]] = [{"role": "user", "content": topic}]
        response = self._call_llm(
            CLASSIFY_SYSTEM_PROMPT,
            messages,
            use_light=True,
            max_tokens=256,
            tools=CLASSIFY_TOOLS,
            tool_choice={"type": "tool", "name": "classify_content"},
        )

        for block in response.content:
            if block.type == "tool_use":
                return cast(dict[str, str], block.input)

        raise ValueError("Classifier did not return a tool call")

    def _chain_tutorial(self, topic: str) -> str:
        """Tutorial chain: Prerequisites → Step-by-Step → Troubleshooting."""
        self._notify("step_start", {"name": "Prerequisites"})
        prerequisites = self._call_llm_text(
            TUTORIAL_PREREQS_PROMPT,
            f"What prerequisites are needed for: {topic}",
        )
        self._notify("step_complete", {"name": "Prerequisites"})

        self._notify("step_start", {"name": "Steps"})
        steps = self._call_llm_text(
            TUTORIAL_STEPS_PROMPT,
            f"Topic: {topic}\n\nPrerequisites:\n{prerequisites}\n\nWrite the step-by-step guide.",
            use_light=True,
        )
        self._notify("step_complete", {"name": "Steps"})

        self._notify("step_start", {"name": "Troubleshooting"})
        troubleshooting = self._call_llm_text(
            TUTORIAL_TROUBLESHOOTING_PROMPT,
            f"Add troubleshooting for this tutorial:\n\n{steps}",
        )
        self._notify("step_complete", {"name": "Troubleshooting"})
        return (
            f"# {topic}\n\n"
            f"## Prerequisites\n\n{prerequisites}\n\n"
            f"## Step-by-Step Guide\n\n{steps}\n\n"
            f"## Troubleshooting\n\n{troubleshooting}"
        )

    def _chain_news(self, topic: str) -> str:
        """News chain: Summary of Changes → Impact Analysis → Call to Action."""
        self._notify("step_start", {"name": "Summary"})
        summary = self._call_llm_text(
            NEWS_SUMMARY_PROMPT,
            f"Summarize the changes: {topic}",
        )
        self._notify("step_complete", {"name": "Summary"})

        # Middle step: straightforward expansion from structured context
        self._notify("step_start", {"name": "Impact"})
        impact = self._call_llm_text(
            NEWS_IMPACT_PROMPT,
            f"Analyze the impact of these changes:\n\n{summary}",
            use_light=True,
        )
        self._notify("step_complete", {"name": "Impact"})

        self._notify("step_start", {"name": "Call to Action"})
        cta = self._call_llm_text(
            NEWS_CTA_PROMPT,
            f"News: {summary}\n\nImpact: {impact}\n\nWrite the call to action.",
        )
        self._notify("step_complete", {"name": "Call to Action"})

        return (
            f"# {topic}\n\n"
            f"## What Changed\n\n{summary}\n\n"
            f"## Impact Analysis\n\n{impact}\n\n"
            f"## What You Should Do\n\n{cta}"
        )

    def _chain_concept(self, topic: str) -> str:
        """Concept chain: Analogy → Architecture Description → Pros/Cons."""
        self._notify("step_start", {"name": "Analogy"})
        analogy = self._call_llm_text(
            CONCEPT_ANALOGY_PROMPT,
            f"Explain with an analogy: {topic}",
        )
        self._notify("step_complete", {"name": "Analogy"})

        # Middle step: straightforward expansion from structured context
        self._notify("step_start", {"name": "Architecture"})
        architecture = self._call_llm_text(
            CONCEPT_ARCHITECTURE_PROMPT,
            f"Concept intro: {analogy}\n\nNow describe the architecture of: {topic}",
            use_light=True,
        )
        self._notify("step_complete", {"name": "Architecture"})

        self._notify("step_start", {"name": "Pros/Cons"})
        pros_cons = self._call_llm_text(
            CONCEPT_PROS_CONS_PROMPT,
            f"Architecture: {architecture}\n\nList pros and cons of: {topic}",
        )
        self._notify("step_complete", {"name": "Pros/Cons"})

        return (
            f"# {topic}\n\n"
            f"## Understanding the Concept\n\n{analogy}\n\n"
            f"## Architecture\n\n{architecture}\n\n"
            f"## Pros and Cons\n\n{pros_cons}"
        )

    def run(self, topic: str, on_event: RouterCallback | None = None) -> str:
        """Classify the topic, route to the appropriate chain, and return the result."""
        self._notify = on_event or (lambda _e, _d: None)

        # Step 1: Classify
        self._notify("classify_start", {})
        classification = self._classify(topic)
        content_type = classification["content_type"]
        reasoning = classification["reasoning"]
        self.token_tracker.report()
        self._notify("classify_complete", {"content_type": content_type, "reasoning": reasoning})

        # Step 2: Route to specialized chain
        routes: dict[str, Callable[[str], str]] = {
            "tutorial": self._chain_tutorial,
            "news": self._chain_news,
            "concept": self._chain_concept,
        }

        chain_fn = routes.get(content_type)
        if not chain_fn:
            raise ValueError(f"Unknown content type: {content_type}")

        self._notify("chain_start", {"content_type": content_type})
        result = chain_fn(topic)
        self.token_tracker.report()
        self._notify("chain_complete", {"content_type": content_type})

        return result


def main() -> None:
    """Run the routing demo."""
    console = Console()
    token_tracker = AnthropicTokenTracker()

    def on_router_event(event: str, data: dict[str, Any]) -> None:
        """Render router events to the console."""
        if event == "classify_start":
            console.print("\n[bold yellow]Step 1:[/bold yellow] Classifying topic...")
        elif event == "classify_complete":
            console.print(
                Panel(
                    f"[bold]{data['content_type'].upper()}[/bold]\n{data['reasoning']}",
                    title="Classification",
                    border_style="cyan",
                )
            )
        elif event == "chain_start":
            console.print(
                f"\n[bold yellow]Step 2:[/bold yellow] Running {data['content_type']} chain..."
            )
        elif event == "step_start":
            console.print(f"  [cyan]{data['name']}...[/cyan]")
        elif event == "step_complete":
            console.print("  [green]\u2713[/green] Done")

    header = Panel(
        "[bold cyan]Routing \u2014 The Content Strategist[/bold cyan]\n\n"
        "Topic \u2192 [Classifier] \u2192 Route [bold]A[/bold], [bold]B[/bold], or [bold]C[/bold] \u2192 [Specialized Chain] \u2192 Post\n\n"
        "[bold]A.[/bold] Tutorial (how-to):  Prerequisites \u2192 Steps \u2192 Troubleshooting\n"
        "[bold]B.[/bold] News/Announcement:  Changes \u2192 Impact \u2192 Call to Action\n"
        "[bold]C.[/bold] Concept Explainer:  Analogy \u2192 Architecture \u2192 Pros/Cons",
        title="Routing Demo",
    )

    try:
        while True:
            topic = interactive_menu(
                console,
                SUGGESTED_TOPICS,
                title="Select a Topic",
                header=header,
                allow_custom=True,
                custom_prompt="Enter your topic",
            )
            if not topic:
                break

            console.print(f"\n[bold green]Topic:[/bold green] {topic}")
            router = ContentRouter(MODEL, LIGHT_MODEL, token_tracker)

            try:
                result = router.run(topic, on_event=on_router_event)

                # Save article to output directory
                OUTPUT_DIR.mkdir(exist_ok=True)
                slug = topic.lower().replace(" ", "_")[:50]
                path = OUTPUT_DIR / f"{slug}.md"
                path.write_text(result, encoding="utf-8")

                console.print("\n[bold blue]Final Article:[/bold blue]")
                console.print(Markdown(result))
                abs_path = path.resolve()
                console.print(f"\n[dim]Saved to [link=file://{abs_path}]{path}[/link][/dim]")

                console.print("\n[dim]Press Enter to continue...[/dim]")
                input()
            except Exception as e:
                logger.error("Routing failed: %s", e)
                console.print(f"\n[red]Error: {e}[/red]")
            finally:
                token_tracker.reset()

    except KeyboardInterrupt:
        console.print("\n[yellow]Interrupted.[/yellow]")


if __name__ == "__main__":
    main()
</script>
<script type="text/plain" id="src-parallelization">"""
Parallelization — "The Social Media Blast"

Demonstrates fan-out for independent work and fan-in to combine results.
Takes a blog post and generates social media content in parallel, plus a voting
pattern for SEO title selection.
"""

from collections.abc import Callable
from concurrent.futures import ThreadPoolExecutor, as_completed
from pathlib import Path
from typing import Any, cast

import anthropic
from dotenv import find_dotenv, load_dotenv
from rich.console import Console
from rich.markdown import Markdown
from rich.panel import Panel

from common import AnthropicTokenTracker, interactive_menu, setup_logging

load_dotenv(find_dotenv())
logger = setup_logging(__name__)

MODEL = "claude-sonnet-4-6"
INPUT_DIR = Path("input")
OUTPUT_DIR = Path("output")

# --- Prompts ---

LINKEDIN_SYSTEM_PROMPT = (
    "You are a LinkedIn content specialist. Write a professional summary of the given "
    "blog post suitable for LinkedIn. Include relevant hashtags. Keep it under 300 words."
)

TWITTER_SYSTEM_PROMPT = (
    "You are a Twitter/X content specialist. Create a thread of exactly 5 tweets from the "
    "given blog post. Each tweet should be under 280 characters. Number them 1/5 through "
    "5/5. Make the first tweet a hook."
)

NEWSLETTER_SYSTEM_PROMPT = (
    "You are an email marketing specialist. Given a blog post, write: 1) A compelling "
    "email subject line, 2) A 2-3 sentence preview/intro paragraph that entices readers "
    "to click through. Format as 'Subject: ...' followed by the intro."
)

SEO_TITLE_SYSTEM_PROMPT = (
    "You are an SEO specialist. Generate exactly ONE compelling SEO title for this blog "
    "post. The title should be 50-60 characters, include relevant keywords, and be "
    "click-worthy. Output only the title, nothing else."
)

SEO_EVALUATOR_SYSTEM_PROMPT = (
    "You are an SEO evaluator. Given candidate titles and the blog post summary, pick "
    "the best title. Consider: keyword relevance, click appeal, length, and clarity. "
    "Output only the number and the winning title."
)

# Callback type: generator emits (event_name, event_data) — caller decides how to display
GeneratorCallback = Callable[[str, dict[str, Any]], None]


class ParallelContentGenerator:
    """Fan-out content generation across multiple independent LLM calls."""

    def __init__(self, model: str, token_tracker: AnthropicTokenTracker):
        self.client = anthropic.Anthropic()
        self.model = model
        self.token_tracker = token_tracker
        self._notify: GeneratorCallback = lambda _e, _d: None

    def _call_llm(self, system: str, user_message: str, temperature: float = 1.0) -> str:
        """Make a single LLM call."""
        logger.info("Calling %s (temp=%.1f)", self.model, temperature)
        response = self.client.messages.create(
            model=self.model,
            max_tokens=2048,
            temperature=temperature,
            system=system,
            messages=[{"role": "user", "content": user_message}],
        )
        self.token_tracker.track(response.usage)
        return cast(str, response.content[0].text)

    def _write_linkedin(self, blog_post: str) -> str:
        """Generate a LinkedIn professional summary."""
        return self._call_llm(
            LINKEDIN_SYSTEM_PROMPT,
            f"Create a LinkedIn post from this blog post:\n\n{blog_post}",
        )

    def _write_twitter(self, blog_post: str) -> str:
        """Generate a Twitter/X thread of 5 tweets."""
        return self._call_llm(
            TWITTER_SYSTEM_PROMPT,
            f"Create a tweet thread from this blog post:\n\n{blog_post}",
        )

    def _write_newsletter(self, blog_post: str) -> str:
        """Generate a newsletter subject line and intro paragraph."""
        return self._call_llm(
            NEWSLETTER_SYSTEM_PROMPT,
            f"Create a newsletter intro from this blog post:\n\n{blog_post}",
        )

    def _generate_seo_title(self, blog_post: str, temperature: float) -> str:
        """Generate a single SEO title candidate at a given temperature."""
        return self._call_llm(
            SEO_TITLE_SYSTEM_PROMPT,
            f"Generate an SEO title for:\n\n{blog_post[:500]}",
            temperature=temperature,
        )

    def _vote_best_title(self, titles: list[str], blog_post: str) -> str:
        """Use an evaluator to pick the best SEO title from candidates."""
        titles_text = "\n".join(f"{i + 1}. {t}" for i, t in enumerate(titles))
        return self._call_llm(
            SEO_EVALUATOR_SYSTEM_PROMPT,
            f"Blog summary: {blog_post[:300]}\n\nCandidate titles:\n{titles_text}\n\n"
            "Which is the best SEO title and why?",
        )

    def run(self, blog_post: str, on_event: GeneratorCallback | None = None) -> dict[str, str]:
        """Execute the full parallelization pipeline."""
        self._notify = on_event or (lambda _e, _d: None)
        results: dict[str, str] = {}

        # Fan-out: run all writers concurrently
        self._notify("fanout_start", {})
        writers = {
            "linkedin": self._write_linkedin,
            "twitter": self._write_twitter,
            "newsletter": self._write_newsletter,
        }

        with ThreadPoolExecutor(max_workers=3) as executor:
            futures = {executor.submit(fn, blog_post): name for name, fn in writers.items()}
            for future in as_completed(futures):
                name = futures[future]
                try:
                    results[name] = future.result()
                    self._notify("writer_complete", {"name": name})
                except Exception as e:
                    logger.error("Writer %s failed: %s", name, e)
                    results[name] = f"Error: {e}"
        self.token_tracker.report()

        # Voting pattern: generate 3 SEO titles with different temperatures
        self._notify("voting_start", {})
        temperatures = [0.3, 0.7, 1.0]
        titles: list[str] = []

        with ThreadPoolExecutor(max_workers=3) as executor:
            futures_list = [
                executor.submit(self._generate_seo_title, blog_post, temp) for temp in temperatures
            ]
            for future in as_completed(futures_list):
                try:
                    title = future.result().strip()
                    titles.append(title)
                    self._notify("title_candidate", {"title": title})
                except Exception as e:
                    logger.error("Title generation failed: %s", e)
        self.token_tracker.report()

        # Evaluate and pick the best title
        if titles:
            self._notify("evaluating_start", {})
            results["seo_vote"] = self._vote_best_title(titles, blog_post)
            self.token_tracker.report()

        self._notify("pipeline_complete", {})
        return results


def _load_input_files() -> dict[str, Path]:
    """Discover blog posts from the input directory, keyed by display name."""
    if not INPUT_DIR.exists():
        return {}
    posts: dict[str, Path] = {}
    for path in sorted(INPUT_DIR.glob("*.md")):
        label = f"{path.stem.replace('_', ' ').title()}  [grey50]({path})[/grey50]"
        posts[label] = path
    return posts


def _clean_label(label: str) -> str:
    """Strip Rich markup from a menu label to get the plain article name."""
    return label.split("  [grey50]")[0]


def main() -> None:
    """Run the parallelization demo."""
    console = Console()
    token_tracker = AnthropicTokenTracker()
    generator = ParallelContentGenerator(MODEL, token_tracker)

    def on_event(event: str, data: dict[str, Any]) -> None:
        """Print pipeline progress to console."""
        if event == "fanout_start":
            console.print(
                "\n[bold yellow]Fan-out:[/bold yellow] Generating social content in parallel..."
            )
        elif event == "writer_complete":
            console.print(f"  [green]✓[/green] {data['name']} complete")
        elif event == "voting_start":
            console.print("\n[bold yellow]Voting:[/bold yellow] Generating SEO title candidates...")
        elif event == "title_candidate":
            console.print(f"  [dim]• {data['title']}[/dim]")
        elif event == "evaluating_start":
            console.print("\n[bold yellow]Evaluating:[/bold yellow] Picking best SEO title...")

    # Load pre-built blog posts from input/
    input_files = _load_input_files()
    labels = list(input_files.keys())

    header = Panel(
        "[bold cyan]Parallelization — The Social Media Blast[/bold cyan]\n\n"
        "Blog Post → [LinkedIn Writer] + [Twitter Writer] + [Newsletter Writer]\n"
        "         → [Aggregator] → Promo Pack\n\n"
        "Also: Voting pattern — 3 SEO titles at different temperatures → evaluator picks best",
        title="Parallelization",
    )

    try:
        while True:
            choice = interactive_menu(
                console,
                labels,
                title="Select a Blog Post",
                header=header,
                allow_custom=True,
                custom_label="✏️  Paste your own...",
                custom_prompt="Enter a short blog topic (or paste text)",
            )
            if not choice:
                break

            # Resolve blog post content
            name = _clean_label(choice) if choice in input_files else choice
            if choice in input_files:
                blog_post = input_files[choice].read_text(encoding="utf-8")
                console.print(f"\n[bold green]Blog Post:[/bold green] {name}")
            elif len(choice) < 200:
                # Short custom input — use as-is (topic or short post)
                blog_post = choice
                console.print(f"\n[bold green]Topic:[/bold green] {name}")
            else:
                blog_post = choice
                console.print(f"\n[bold green]Custom post:[/bold green] ({len(choice)} chars)")

            try:
                results = generator.run(blog_post, on_event=on_event)

                # Save promo pack to output directory
                OUTPUT_DIR.mkdir(exist_ok=True)
                slug = name.lower().replace(" ", "_")[:50]
                path = OUTPUT_DIR / f"{slug}_promo.md"
                output_parts = [f"# Promo Pack: {name}\n"]
                for key, value in results.items():
                    output_parts.append(f"## {key.upper()}\n\n{value}\n")
                path.write_text("\n".join(output_parts), encoding="utf-8")

                console.print("\n[bold blue]Promo Pack:[/bold blue]")
                for key, value in results.items():
                    console.print(Panel(Markdown(value), title=key.upper(), border_style="cyan"))

                abs_path = path.resolve()
                console.print(f"\n[dim]Saved to [link=file://{abs_path}]{path}[/link][/dim]")

                console.print("\n[dim]Press Enter to continue...[/dim]")
                input()
            except Exception as e:
                logger.error("Parallelization failed: %s", e)
                console.print(f"\n[red]Error: {e}[/red]")
            finally:
                token_tracker.report()
                token_tracker.reset()

    except KeyboardInterrupt:
        console.print("\n[yellow]Interrupted.[/yellow]")


if __name__ == "__main__":
    main()
</script>
<script type="text/plain" id="src-orchestrator">"""
Orchestrator-Workers — "The Deep Dive Researcher"

Demonstrates a central LLM dynamically breaking down a task, delegating subtasks
to worker LLMs, and synthesizing their results into a final article.
"""

from collections.abc import Callable
from concurrent.futures import ThreadPoolExecutor, as_completed
from pathlib import Path
from typing import Any, cast

import anthropic
from dotenv import find_dotenv, load_dotenv
from rich.console import Console
from rich.markdown import Markdown
from rich.panel import Panel

from common import AnthropicTokenTracker, interactive_menu, setup_logging

load_dotenv(find_dotenv())
logger = setup_logging(__name__)

OUTPUT_DIR = Path("output")
MODEL = "claude-sonnet-4-6"
LIGHT_MODEL = "claude-haiku-4-5-20251001"

# Anthropic server-side web search tool — Claude decides when to search
WEB_SEARCH_TOOL = {"type": "web_search_20250305", "name": "web_search", "max_uses": 1}

SUGGESTED_TOPICS = [
    "Compare Bun vs Node.js for Backend Development",
    "Python 3.13 New Features and Performance",
    "WebAssembly in Production: State of the Art",
    "AI Code Review Tools Landscape 2025",
]

# --- Prompts ---

ORCHESTRATOR_SYSTEM_PROMPT = (
    "You are a research orchestrator. Given a topic, break it down into 2-4 specific "
    "research subtopics that can be investigated independently. Each subtopic should "
    "cover a distinct dimension of the topic. Think like a journalist who would "
    "research each angle separately before writing."
)

WORKER_SYSTEM_PROMPT = (
    "You are a thorough technical researcher. Research the given topic in depth. "
    "Provide specific details, examples, comparisons, and data points where possible. "
    "Write 3-4 paragraphs of substantive analysis. "
    "Use web search if the topic would benefit from current information."
)

SYNTHESIZER_SYSTEM_PROMPT = (
    "You are a senior technical writer. Given research from multiple sources on different "
    "subtopics, synthesize them into a cohesive, well-structured article."
)

# Tool for the orchestrator to decompose tasks
PLANNING_TOOLS = [
    {
        "name": "create_research_plan",
        "description": "Break down a topic into specific research subtopics for workers.",
        "input_schema": {
            "type": "object",
            "properties": {
                "subtopics": {
                    "type": "array",
                    "items": {
                        "type": "object",
                        "properties": {
                            "title": {
                                "type": "string",
                                "description": "Subtopic title",
                            },
                            "research_prompt": {
                                "type": "string",
                                "description": "Specific research question for the worker",
                            },
                        },
                        "required": ["title", "research_prompt"],
                    },
                    "description": "List of subtopics to research in parallel",
                },
                "synthesis_instructions": {
                    "type": "string",
                    "description": "Instructions for how to combine the research into a final article",
                },
            },
            "required": ["subtopics", "synthesis_instructions"],
        },
    }
]

# Callback type: agent emits (event_name, event_data) — caller decides how to display
OrchestratorCallback = Callable[[str, dict[str, Any]], None]


class OrchestratorWorkers:
    """Orchestrator decomposes tasks dynamically, workers execute in parallel."""

    def __init__(self, model: str, light_model: str, token_tracker: AnthropicTokenTracker):
        self.client = anthropic.Anthropic()
        self.model = model
        self.light_model = light_model
        self.token_tracker = token_tracker
        self._notify: OrchestratorCallback = lambda _e, _d: None

    def _call_llm(
        self,
        system: str,
        messages: list[dict[str, Any]],
        *,
        use_light: bool = False,
        max_tokens: int = 4096,
        tools: list[dict[str, Any]] | None = None,
        tool_choice: dict[str, str] | None = None,
    ) -> anthropic.types.Message:
        """Single LLM call with token tracking."""
        model = self.light_model if use_light else self.model
        kwargs: dict[str, Any] = {}
        if tools:
            kwargs["tools"] = tools
        if tool_choice:
            kwargs["tool_choice"] = tool_choice
        tool_names = [t.get("name", t.get("type", "unknown")) for t in tools or []]
        logger.info("Calling %s, tools=%s", model, tool_names)

        response = self.client.messages.create(
            model=model,
            max_tokens=max_tokens,
            system=system,
            messages=messages,
            **kwargs,
        )
        self.token_tracker.track(response.usage)
        return response

    def _call_llm_text(self, system: str, user_message: str, **kwargs: Any) -> str:
        """Call LLM and return the text content."""
        messages: list[dict[str, Any]] = [{"role": "user", "content": user_message}]
        return cast(str, self._call_llm(system, messages, **kwargs).content[0].text)
