const nl2br = s => esc(s).replace(/\n/g, "<br>");
const stripEmoji = s => String(s).replace(/^[\p{Extended_Pictographic}\uFE0F\u200D\s]+/u, "");

/* ---------- markdown mínimo (patrones en producción) ---------- */
function mdInline(s){
  let t = esc(s);
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  t = t.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return t;
}
function mdToHtml(md){
  const out = [];
  const parts = md.split(/```([\w-]*)\n([\s\S]*?)```/g);
  for (let k = 0; k < parts.length; k++){
    if (k % 3 === 1) continue;
    if (k % 3 === 2){ out.push(`<pre class="code">${esc(parts[k].replace(/\n$/, ""))}</pre>`); continue; }
    const lines = parts[k].split("\n");
    let list = null, para = [], table = [];
    const flushP = () => { if (para.length){ out.push(`<p>${mdInline(para.join(" "))}</p>`); para = []; } };
    const flushL = () => { if (list){ out.push(`<${list.t}>${list.items.map(i => `<li>${mdInline(i)}</li>`).join("")}</${list.t}>`); list = null; } };
    const flushT = () => {
      if (!table.length) return;
      const rows = table.filter(r => !/^\|?\s*:?-{2,}/.test(r)).map(r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
      out.push(`<table class="mdt">${rows.map((r, i) => `<tr>${r.map(c => i ? `<td>${mdInline(c)}</td>` : `<th>${mdInline(c)}</th>`).join("")}</tr>`).join("")}</table>`);
      table = [];
    };
    for (const raw of lines){
      const l = raw.trimEnd();
      let m;
      if (/^\s*\|/.test(l)){ flushP(); flushL(); table.push(l.trim()); continue; } else flushT();
      if (!l.trim()){ flushP(); flushL(); continue; }
      if ((m = l.match(/^#{3,6}\s+(.*)$/))){ flushP(); flushL(); out.push(`<h5>${mdInline(m[1])}</h5>`); continue; }
      if ((m = l.match(/^\s*[-*]\s+(.*)$/))){ flushP(); if (!list || list.t !== "ul"){ flushL(); list = { t: "ul", items: [] }; } list.items.push(m[1]); continue; }
      if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ flushP(); if (!list || list.t !== "ol"){ flushL(); list = { t: "ol", items: [] }; } list.items.push(m[1]); continue; }
      if ((m = l.match(/^>\s?(.*)$/))){ flushP(); flushL(); out.push(`<blockquote>${mdInline(m[1])}</blockquote>`); continue; }
      if (list && /^\s{2,}\S/.test(raw)){ list.items[list.items.length - 1] += " " + l.trim(); continue; }
      flushL(); para.push(l.trim());
    }
    flushP(); flushL(); flushT();
  }
  return out.join("");
}

/* ---------- reproductor de diagramas (mismo motor visual que los mapas) ---------- */
const LBL_MAXC = 23;    // = int(LBL_MAX / LBL_CW) en tools/diagrams.py
function wrapLabel(text){
  const out = []; let line = "";
  for (const w of String(text).split(/\s+/)){
    if (!w) continue;
    if (line && line.length + 1 + w.length > LBL_MAXC){ out.push(line); line = w; } else line = line ? line + " " + w : w;
  }
  if (line) out.push(line);
  return out;
}
function diagramSvg(d){
  const [vx, vy, W, H] = d.vb;
  const deco = d.deco.map(x => {
    if (x.type === "lifeline") return `<line class="lifeline" x1="${x.x}" y1="${x.y1}" x2="${x.x}" y2="${x.y2}"/>`;
    if (x.type === "frame"){
      const tag = `${x.kind}${x.title ? " · " + x.title : ""}`;
      const tw = Math.min(x.w - 10, tag.length * 6.2 + 16);
      return `<g class="sqf"><rect class="sqframe" x="${x.x}" y="${x.y}" width="${x.w}" height="${x.h}" rx="6"/>
        <rect class="sqtag" x="${x.x}" y="${x.y}" width="${tw}" height="18" rx="5"/>
        <text class="sqtagt" x="${x.x + 8}" y="${x.y + 13}">${esc(tag)}</text>
        ${x.elses.map(e => `<line class="sqelse" x1="${x.x}" y1="${e.y - 8}" x2="${x.x + x.w}" y2="${e.y - 8}"/>
          <text class="sqtagt" x="${x.x + 8}" y="${e.y + 6}">${esc("else" + (e.title ? " · " + e.title : ""))}</text>`).join("")}</g>`;
    }
    return "";
  }).join("");
  const edges = d.edges.map(e => `<path class="edge" data-edge="${esc(e.id)}" d="${e.d}" ${e.dash ? 'stroke-dasharray="6 5"' : ""}/>`).join("");
  const nodes = d.nodes.map(n => `<foreignObject x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}">
      <div xmlns="http://www.w3.org/1999/xhtml" class="dnode c-${n.cls}" data-dnode="${esc(n.id)}">

      </div></foreignObject>`).join("");
  const labels = d.edges.filter(e => e.label && e.lx !== null && e.lx !== undefined).map(e => {
    const ls = wrapLabel(e.label);
    const w = Math.max(...ls.map(l => l.length)) * 6.3 + 18, h = 8 + 13 * ls.length;
    const y0 = e.ly - (ls.length - 1) * 6.5 + 3.6;
    return `<g class="lbl"><rect class="lblplate" x="${e.lx - w / 2}" y="${e.ly - h / 2}" width="${w}" height="${h}" rx="${Math.min(10, h / 2)}"/>
      <text class="edge-label" text-anchor="middle">${ls.map((l, i) => `<tspan x="${e.lx}" y="${y0 + i * 13}">${esc(l)}</tspan>`).join("")}</text></g>`;
  }).join("");
  const minW = Math.min(W, 1000);
  return `<svg viewBox="${vx} ${vy} ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;max-width:${W}px;min-width:${minW}px;height:auto;margin:0 auto">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker>

    </defs>
    <g id="deco">${deco}</g><g id="edges">${edges}</g><g id="flowdots"></g><g id="nodes">${nodes}</g><g id="nodelabels">${labels}</g>
  </svg>`;
}

let DP = null;   // estado del reproductor: {d, idx, timer}
function mountPlayer(el, d, title, sub){
  stopDPlay();

  const legend = d.kind === "seq"
    ? `<span><i style="background:var(--blue)"></i>Participante</span><span><i style="background:var(--amber)"></i>Nota</span><span><i style="background:var(--accent)"></i>Mensaje activo</span>`

  el.innerHTML = `
    <div class="mapcard">
      <div class="head"><h2>${esc(title)}</h2><span class="tag">${esc(sub || "")}</span><div class="legend">${legend}</div></div>
      <div class="mapwrap">${diagramSvg(d)}</div>
      <div class="controls">
        <button class="btn" onclick="dGo(0)">⏮</button>
        <button class="btn" onclick="dGo(DP.idx-1)">◀</button>
        <button class="btn primary" id="dPlay" onclick="toggleDPlay()">▶ Reproducir</button>
        <button class="btn" onclick="dGo(DP.idx+1)">▶</button>
        <button class="btn" onclick="dGo(DP.d.steps.length-1)">⏭</button>
        <div class="progress" id="dprogress"><div class="fill" id="dpfill"></div></div>
        <span class="stepinfo" id="dstepinfo"></span>
      </div>
      <div style="padding:0 16px 14px" class="dots" id="ddots">${d.steps.map((s, i) => `<div class="dot" title="${esc(s.title)}" onclick="dGo(${i})"></div>`).join("")}</div>
      <div class="maphint">» <b>Haz clic en cualquier nodo</b> para saltar al primer paso donde participa. Teclado: <b>← →</b> para avanzar, <b>Espacio</b> para reproducir.</div>
    </div>
    <div class="card" id="dstepcard" style="margin-top:16px"></div>`;
  el.querySelectorAll(".dnode").forEach(n => n.addEventListener("click", () => {
    const i = DP.d.steps.findIndex(s => s.nodes.includes(n.dataset.dnode));
    if (i >= 0) dGo(i);
  }));
  document.getElementById("dprogress").onclick = e => {
    const r = e.currentTarget.getBoundingClientRect();
    dGo(Math.floor((e.clientX - r.left) / r.width * DP.d.steps.length));
  };
  dGo(0);
}
function dGo(i){
  if (!DP || !DP.d.steps.length) return;
  const S = DP.d.steps;
  DP.idx = Math.max(0, Math.min(S.length - 1, i));
  const st = S[DP.idx];
  document.querySelectorAll(".dnode").forEach(n => n.classList.toggle("is-active", st.nodes.includes(n.dataset.dnode)));
  document.querySelectorAll("#edges .edge").forEach(p => p.classList.toggle("active", st.edges.includes(p.dataset.edge)));
  setFlowEdges(null, st.edges);
  document.getElementById("dpfill").style.width = ((DP.idx + 1) / S.length * 100) + "%";
  document.getElementById("dstepinfo").textContent = `Paso ${DP.idx + 1} de ${S.length}`;
  document.querySelectorAll("#ddots .dot").forEach((d, k) => { d.classList.toggle("on", k === DP.idx); d.classList.toggle("done", k < DP.idx); });
  const prev = S[DP.idx - 1], next = S[DP.idx + 1];
  const names = st.nodes.map(id => { const n = DP.d.nodes.find(x => x.id === id); return n ? (n.title || "Nota") : id; });
  document.getElementById("dstepcard").innerHTML = `
    <div class="phase">Paso ${DP.idx + 1} de ${S.length}</div>
    <div class="action" style="font-weight:700">${esc(st.title)}</div>
    ${st.description ? `<div class="action">${nl2br(st.description)}</div>` : ""}
    ${names.length ? `<div class="badges">${names.map(n => `<span class="badge model">● ${esc(stripEmoji(n))}</span>`).join("")}</div>` : ""}
    ${st.input ? `<h4 class="inph">Datos de este paso</h4><pre class="code">${esc(st.input)}</pre>` : ""}
    <div class="bc" style="margin-top:12px">
      <div class="box before"><h4>&lt;&lt; antes</h4><ul><li>${prev ? esc(prev.title) : "Inicio del flujo."}</li></ul></div>
      <div class="box after"><h4>&gt;&gt; después</h4><ul><li>${next ? esc(next.title) : "Fin del flujo."}</li></ul></div>
    </div>`;
}
function toggleDPlay(){
  if (!DP) return;
  if (DP.timer) return stopDPlay();
  if (DP.idx >= DP.d.steps.length - 1) dGo(0);
  DP.timer = setInterval(() => { if (DP.idx < DP.d.steps.length - 1) dGo(DP.idx + 1); else stopDPlay(); }, speed);
  const b = document.getElementById("dPlay"); if (b) b.textContent = "⏸ Pausar";
}
function stopDPlay(){
  if (DP && DP.timer){ clearInterval(DP.timer); DP.timer = null; }
  const b = document.getElementById("dPlay"); if (b) b.textContent = "▶ Reproducir";
}
document.addEventListener("keydown", e => {
  if (current !== "biblioteca" || !LIBVIEW || LIBDETTAB !== "flow" || !DP) return;
  if (e.target && e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") dGo(DP.idx + 1);
  else if (e.key === "ArrowLeft") dGo(DP.idx - 1);
  else if (e.key === " "){ e.preventDefault(); toggleDPlay(); }
});

// al cambiar de vista, detener también el reproductor de diagramas
const _renderBase = render;
render = function(){ stopDPlay(); if (current !== "biblioteca") LIBVIEW = null; _renderBase(); };

Object.assign(window, { openTech, openProd, closeLibDetail, setLibTab, onLibSearch, setDetTab, dGo, toggleDPlay });

const _renderLib = render;
render = function(){
  stopHomeLog();
  document.body.classList.toggle("on-home", current === "home");
  if (current === "home"){ buildTabs(); stopPlay(); stopDPlay(); renderHome(); return; }
  _renderLib();
  main.insertAdjacentHTML("afterbegin", `<div class="pathbar"><span class="u">visitante@agentes</span>:<span class="p">${esc(currentPath())}</span>$ <span class="c">${esc(currentCmd())}</span></div>`);
};
const slugify = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function currentPath(){
  if (current === null) return "~/patrones";

    if (LIBVIEW.type === "tech"){ const c = findCat(LIBVIEW.cat); return `~/biblioteca/agentic-design/${slugify(c ? c.group.name : "")}/${LIBVIEW.cat}/${LIBVIEW.slug}`; }
    const p = findProd(LIBVIEW.slug); return `~/biblioteca/agentic-patterns/${slugify(p ? p.category : "")}/${LIBVIEW.slug}`;
  }
  const p = PATTERNS.find(x => x.id === current);
  return p ? `~/patrones/${String(p.num).padStart(2, "0")}-${slugify(p.title)}` : "~";
}
function currentCmd(){
  if (current === null) return "ls --agrupar";
  if (current === "biblioteca") return LIBVIEW ? (LIBDETTAB === "flow" ? "./reproducir --flujo" : "cat resumen.md") : "ls";
  return "./ejecutar --paso-a-paso";
}
const _buildTabsBase = buildTabs;
buildTabs = function(){
  _buildTabsBase();
  const t = document.createElement("div");
  t.className = "tab" + (current === "home" ? " active" : "");
  t.innerHTML = '<span class="n">~</span>Inicio';
  t.onclick = goHome;
  tabsEl.insertBefore(t, tabsEl.firstChild);
};
Object.assign(window, { goHome, goOverview, goLibrary, toggleHomeLog });

/* init */
current = "home";
render();
